  /live/stream:
    get:
      tags:
        - Live
      summary: Live SSE stream (weather + shops)
      description: |
        Server-Sent Events (SSE) stream for real-time weather and shop updates on a single connection.

        **Connection:**
        - Opens a persistent connection
        - Emits `weather` and `shops` events
        - Auto-reconnects on disconnect

        **Event format:**
        ```
        event: weather
        data: {"weather": "Clear Skies"}

        event: shops
        data: {"seed":{"secondsUntilRestock":3600,"items":[{"name":"Carrot","stock":10}]},"tool":{...},"egg":{...},"decor":{...}}
        ```

        **Usage examples:**

        **JavaScript:**
        ```javascript
        const eventSource = new EventSource('/live/stream');
        eventSource.addEventListener('weather', (event) => {
          const data = JSON.parse(event.data);
          console.log('Weather:', data.weather);
        });
        eventSource.addEventListener('shops', (event) => {
          const shops = JSON.parse(event.data);
          console.log('Seed shop:', shops.seed);
        });
        ```

        **cURL:**
        ```bash
        curl -N /live/stream
        ```
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: weather
                data: {"weather":"Clear Skies"}

                event: shops
                data: {"seed":{"secondsUntilRestock":3600,"items":[{"name":"Carrot","stock":10}]}}

  /live/weather/stream:
    get:
      tags:
        - Live
      summary: Weather SSE stream
      description: |
        Server-Sent Events (SSE) stream for real-time weather updates.

        **Connection:**
        - Opens a persistent connection
        - Receives weather updates as they happen
        - Auto-reconnects on disconnect

        **Event format:**
        ```
        event: weather
        data: {"weather": "Clear Skies"}

        event: weather
        data: {"weather": "Rainy"}
        ```

        **Usage examples:**

        **JavaScript:**
        ```javascript
        const eventSource = new EventSource('/live/weather/stream');
        eventSource.addEventListener('weather', (event) => {
          const data = JSON.parse(event.data);
          console.log('Weather changed to:', data.weather);
        });
        ```

        **cURL:**
        ```bash
        curl -N /live/weather/stream
        ```

        **Python:**
        ```python
        import requests
        response = requests.get('/live/weather/stream', stream=True)
        for line in response.iter_lines():
            if line.startswith(b'data:'):
                print(line.decode())
        ```
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: weather
                data: {"weather":"Clear Skies"}

                event: weather
                data: {"weather":"Rainy"}

  /live/shops/stream:
    get:
      tags:
        - Live
      summary: Shops SSE stream
      description: |
        Server-Sent Events (SSE) stream for real-time shop inventory updates.

        **Connection:**
        - Opens a persistent connection
        - Receives shop updates when inventory changes or restocks occur
        - Auto-reconnects on disconnect

        **Event format:**
        ```
        event: shops
        data: {"seed":{"secondsUntilRestock":3600,"items":[{"name":"Carrot","stock":10}]},"tool":{...},"egg":{...},"decor":{...}}
        ```

        **Usage examples:**

        **JavaScript:**
        ```javascript
        const eventSource = new EventSource('/live/shops/stream');
        eventSource.addEventListener('shops', (event) => {
          const shops = JSON.parse(event.data);
          console.log('Seed shop:', shops.seed);
          console.log('Time until restock:', shops.seed.secondsUntilRestock);
        });
        ```

        **React Hook:**
        ```javascript
        import { useEffect, useState } from 'react';

        function useShops() {
          const [shops, setShops] = useState(null);

          useEffect(() => {
            const eventSource = new EventSource('/live/shops/stream');
            eventSource.addEventListener('shops', (event) => {
              setShops(JSON.parse(event.data));
            });
            return () => eventSource.close();
          }, []);

          return shops;
        }
        ```

        **cURL:**
        ```bash
        curl -N /live/shops/stream
        ```
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: shops
                data: {"seed":{"secondsUntilRestock":3600,"items":[{"name":"Carrot","stock":10},{"name":"Cabbage","stock":15}]},"tool":{"secondsUntilRestock":7200,"items":[{"name":"WateringCan","stock":3}]},"egg":{"secondsUntilRestock":10800,"items":[]},"decor":{"secondsUntilRestock":14400,"items":[]}}

  /stats/items:
    get:
      tags:
        - Stats
      summary: Aggregated item stats for a shop
      description: |
        Returns minimal rarity stats per item for a given shop and time window.

        **For each item** the response includes:
        - `appearances`: number of restocks where the item was present
        - `drop_rate`: `appearances / total_restocks` (between 0 and 1)
        - `total_stock`: total units distributed across all appearances (`SUM(stock)`)
        - `avg_stock` / `min_stock` / `max_stock`: stock distribution per appearance
        - `last_seen`: epoch ms of the most recent restock containing this item

        Default sort is `appearances ASC` so the rarest items show up first (e.g. Celestial seeds).
      parameters:
        - name: shop
          in: query
          required: true
          schema:
            type: string
            enum: [seed, tool, egg, decor, dawn, snow, thunder]
          description: Shop type
        - name: from
          in: query
          required: false
          schema:
            type: string
          description: Window start (epoch ms or ISO 8601). Defaults to 30 days ago.
          example: "2025-11-17"
        - name: to
          in: query
          required: false
          schema:
            type: string
          description: Window end (epoch ms or ISO 8601). Defaults to now.
          example: "2026-05-17"
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [appearances, drop_rate, total_stock, avg_stock, min_stock, max_stock, last_seen, item_id]
            default: appearances
          description: Sort column
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          description: Sort direction
      responses:
        '200':
          description: Aggregated items
          content:
            application/json:
              schema:
                type: object
                properties:
                  shop:
                    type: string
                    example: "seed"
                  from:
                    type: integer
                    example: 1776210390293
                  to:
                    type: integer
                    example: 1778802390293
                  total_restocks:
                    type: integer
                    description: Total number of restocks observed in the window for this shop
                    example: 720
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        item_id:
                          type: string
                          example: "Starweaver"
                        appearances:
                          type: integer
                          example: 4
                        drop_rate:
                          type: number
                          format: float
                          minimum: 0
                          maximum: 1
                          example: 0.012
                        total_stock:
                          type: integer
                          description: Total units distributed (sum of stock across appearances)
                          example: 6
                        avg_stock:
                          type: number
                          format: float
                          example: 1.5
                        min_stock:
                          type: integer
                          example: 1
                        max_stock:
                          type: integer
                          example: 3
                        last_seen:
                          type: integer
                          description: Epoch ms of the most recent restock containing this item
                          example: 1778801479977
        '400':
          description: Invalid shop / range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /stats/items/timeseries:
    get:
      tags:
        - Stats
      summary: Time series of item drop rates
      description: |
        Returns drop rate / appearances / average stock per time bucket for one or more items.

        Useful for multi-line charts comparing items over time. Each requested item gets its own series with a point per bucket (empty buckets are filled with zeros).
      parameters:
        - name: shop
          in: query
          required: true
          schema:
            type: string
            enum: [seed, tool, egg, decor, dawn, snow, thunder]
        - name: ids
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated item ids to include in the response.
          example: "Carrot,Strawberry,Lily"
        - name: from
          in: query
          schema:
            type: string
          description: Window start (epoch ms or ISO 8601). Default 30 days ago.
        - name: to
          in: query
          schema:
            type: string
          description: Window end (epoch ms or ISO 8601). Default now.
        - name: bucket
          in: query
          schema:
            type: string
            enum: [hour, day, week]
            default: day
      responses:
        '200':
          description: Time series
          content:
            application/json:
              schema:
                type: object
                properties:
                  shop:
                    type: string
                  bucket:
                    type: string
                  from:
                    type: integer
                  to:
                    type: integer
                  series:
                    type: array
                    items:
                      type: object
                      properties:
                        item_id:
                          type: string
                        points:
                          type: array
                          items:
                            type: object
                            properties:
                              t:
                                type: integer
                                description: Bucket start (epoch ms, UTC-aligned)
                              appearances:
                                type: integer
                              total_restocks:
                                type: integer
                                description: Total restocks of this shop in this bucket
                              drop_rate:
                                type: number
                                format: float
                              avg_stock:
                                type: number
                                format: float
                                nullable: true
                                description: Null when the item did not appear in this bucket
              examples:
                series:
                  summary: Two items, 3 daily buckets
                  value:
                    shop: "seed"
                    bucket: "day"
                    from: 1778457600000
                    to: 1778716800000
                    series:
                      - item_id: "Carrot"
                        points:
                          - t: 1778457600000
                            appearances: 12
                            total_restocks: 24
                            drop_rate: 0.5
                            avg_stock: 7.3
                          - t: 1778544000000
                            appearances: 0
                            total_restocks: 24
                            drop_rate: 0
                            avg_stock: null
                      - item_id: "Strawberry"
                        points:
                          - t: 1778457600000
                            appearances: 3
                            total_restocks: 24
                            drop_rate: 0.125
                            avg_stock: 2.0
        '400':
          description: Invalid shop / bucket / range / too many buckets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /stats/items/events:
    get:
      tags:
        - Stats
      summary: Raw item appearance events for a shop
      description: |
        Returns one row per item appearance (= one row per `(restock, item)` pair).

        Use this endpoint when you need exact `restocked_at` timestamps, for example
        a chart zoomed in tight enough that day/hour buckets would hide individual drops.

        The response includes `restock_interval_seconds` from the parent restock,
        so callers can derive the in-shop presence window
        (`[restocked_at, restocked_at + restock_interval_seconds * 1000)`) without
        knowing shop cadences out-of-band.

        Capped at 20 000 events per call (default 5 000). For wider windows,
        prefer `/stats/items/timeseries` with `bucket=day` or `bucket=hour`.
      parameters:
        - name: shop
          in: query
          required: true
          schema:
            type: string
            enum: [seed, tool, egg, decor, dawn, snow, thunder]
          description: Shop type
        - name: ids
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated item IDs. When omitted, returns events for every item in the shop.
          example: "MoonCelestial,Dawnbreaker"
        - name: from
          in: query
          required: false
          schema:
            type: string
          description: Window start (epoch ms or ISO 8601). Defaults to 30 days ago.
        - name: to
          in: query
          required: false
          schema:
            type: string
          description: Window end (epoch ms or ISO 8601). Defaults to now.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20000
            default: 5000
          description: Max number of events to return.
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          description: Sort order by `restocked_at`. Default `asc` (chronological).
      responses:
        '200':
          description: Item events
          content:
            application/json:
              schema:
                type: object
                properties:
                  shop:
                    type: string
                    example: "seed"
                  from:
                    type: integer
                    example: 1779115619918
                  to:
                    type: integer
                    example: 1779288419943
                  count:
                    type: integer
                    description: Number of events returned (may be capped by `limit`).
                    example: 1
                  limit:
                    type: integer
                    example: 5000
                  ids:
                    type: array
                    description: Echoes the filter when `ids` was supplied.
                    items:
                      type: string
                    example: ["MoonCelestial", "Dawnbreaker"]
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        item_id:
                          type: string
                          example: "MoonCelestial"
                        restocked_at:
                          type: integer
                          description: Epoch ms of the parent restock.
                          example: 1779225300679
                        stock:
                          type: integer
                          description: Quantity of this item in the restock.
                          example: 1
                        restock_interval_seconds:
                          type: integer
                          description: Cadence of the parent restock at the time it happened. Add this (× 1000) to `restocked_at` to get the moment the item left the shop.
                          example: 300
              examples:
                seed_two_celestials:
                  summary: Two celestial seeds over the last 2 days
                  value:
                    shop: "seed"
                    from: 1779115619918
                    to: 1779288419943
                    count: 1
                    limit: 5000
                    ids: ["MoonCelestial", "Dawnbreaker"]
                    events:
                      - item_id: "MoonCelestial"
                        restocked_at: 1779225300679
                        stock: 1
                        restock_interval_seconds: 300
        '400':
          description: Invalid shop / range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /stats/weather:
    get:
      tags:
        - Stats
      summary: Aggregated weather distribution
      description: |
        Returns the distribution of every weather observed over the requested time window:
        total duration (ms), share of the window (0..1), number of distinct occurrences, and average duration per occurrence.

        Weather events still in progress at `to` are clamped to that boundary; events still open in DB (`ended_at = NULL`) are clamped to `now`.
      parameters:
        - name: from
          in: query
          schema:
            type: string
          description: Window start (epoch ms or ISO 8601). Default 30 days ago.
        - name: to
          in: query
          schema:
            type: string
          description: Window end (epoch ms or ISO 8601). Default now.
      responses:
        '200':
          description: Weather distribution
          content:
            application/json:
              schema:
                type: object
                properties:
                  from:
                    type: integer
                  to:
                    type: integer
                  total_duration:
                    type: integer
                    description: Sum of durations across all weathers in the window (ms). Can be less than `to - from` if recording started inside the window.
                  weathers:
                    type: array
                    items:
                      type: object
                      properties:
                        weather:
                          type: string
                          example: "Clear Skies"
                        duration:
                          type: integer
                          description: Total time spent in this weather (ms)
                        share:
                          type: number
                          format: float
                          description: duration / total_duration (0..1)
                        occurrences:
                          type: integer
                          description: Number of distinct events of this weather
                        avg_duration:
                          type: number
                          format: float
                          description: duration / occurrences (ms)
              examples:
                distribution:
                  value:
                    from: 1776210390000
                    to: 1778802390000
                    total_duration: 86400000
                    weathers:
                      - weather: "Clear Skies"
                        duration: 50400000
                        share: 0.583
                        occurrences: 8
                        avg_duration: 6300000
                      - weather: "Rain"
                        duration: 28800000
                        share: 0.333
                        occurrences: 4
                        avg_duration: 7200000
        '400':
          description: Invalid range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /stats/weather/timeseries:
    get:
      tags:
        - Stats
      summary: Time series of weather durations
      description: |
        Returns total duration (ms) spent in each weather per time bucket.

        Each point has a `durations` object keyed by weather name. Weathers that did not occur in a bucket are simply absent from that bucket's object (interpret as 0). Weather events spanning multiple buckets are split proportionally.

        Ideal for stacked area / bar charts showing the breakdown of weather over time.
      parameters:
        - name: from
          in: query
          schema:
            type: string
          description: Window start (epoch ms or ISO 8601). Default 30 days ago.
        - name: to
          in: query
          schema:
            type: string
          description: Window end (epoch ms or ISO 8601). Default now.
        - name: bucket
          in: query
          schema:
            type: string
            enum: [hour, day, week]
            default: day
      responses:
        '200':
          description: Weather time series
          content:
            application/json:
              schema:
                type: object
                properties:
                  bucket:
                    type: string
                  from:
                    type: integer
                  to:
                    type: integer
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        t:
                          type: integer
                          description: Bucket start (epoch ms, UTC-aligned)
                        durations:
                          type: object
                          additionalProperties:
                            type: integer
                            description: Duration in ms spent in that weather during the bucket
              examples:
                series:
                  value:
                    bucket: "day"
                    from: 1778457600000
                    to: 1778716800000
                    points:
                      - t: 1778457600000
                        durations:
                          "Clear Skies": 50400000
                          "Rain": 28800000
                          "Snow": 7200000
                      - t: 1778544000000
                        durations:
                          "Clear Skies": 86400000
        '400':
          description: Invalid bucket / range / too many buckets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /stats/weather/events:
    get:
      tags:
        - Stats
      summary: Raw weather event timeline
      description: |
        Returns every weather event that overlaps the requested window.

        **Clamping:** `started_at` and `ended_at` are clamped to `[from, to]`. For the active event (still in progress), `ended_at` is clamped to `min(now, to)`. The boolean `in_progress` flags the originally open event.

        Useful for rendering an exact intra-bucket timeline instead of pre-aggregated durations.
      parameters:
        - name: from
          in: query
          schema:
            type: string
          description: Window start (epoch ms or ISO 8601). Default 30 days ago.
        - name: to
          in: query
          schema:
            type: string
          description: Window end (epoch ms or ISO 8601). Default now.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Weather events
          content:
            application/json:
              schema:
                type: object
                properties:
                  from:
                    type: integer
                  to:
                    type: integer
                  count:
                    type: integer
                  limit:
                    type: integer
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        weather:
                          type: string
                          example: "Snow"
                        started_at:
                          type: integer
                          description: Clamped to >= window `from`
                          example: 1778800000000
                        ended_at:
                          type: integer
                          description: Clamped to <= window `to` (or `now` when the event is in progress)
                          example: 1778803600000
                        in_progress:
                          type: boolean
                          description: True if this event was still open in DB (originally `ended_at = NULL`)
                          example: false

  /stats/shops/restocks:
    get:
      tags:
        - Stats
      summary: Raw shop restock timeline
      description: |
        Returns every restock event for a given shop within the requested window. Each restock embeds its full item list (item_id + initial stock).

        Useful for inspecting the exact composition of a specific past restock or rendering an intra-bucket timeline.

        **Item filter (`ids`):** when provided, only restocks containing at least one of the requested item ids are returned, and each restock's `items[]` is restricted to those matching ids. Ideal for "when did item X appear today?" lookups without pulling the full payload.
      parameters:
        - name: shop
          in: query
          required: true
          schema:
            type: string
            enum: [seed, tool, egg, decor, dawn, snow, thunder]
        - name: ids
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated item ids. When set, restricts both restocks returned and the items embedded in each.
          example: "DawnCelestial,MoonCelestial"
        - name: from
          in: query
          schema:
            type: string
          description: Window start (epoch ms or ISO 8601). Default 30 days ago.
        - name: to
          in: query
          schema:
            type: string
          description: Window end (epoch ms or ISO 8601). Default now.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Shop restocks with embedded items
          content:
            application/json:
              schema:
                type: object
                properties:
                  shop:
                    type: string
                  from:
                    type: integer
                  to:
                    type: integer
                  count:
                    type: integer
                  limit:
                    type: integer
                  ids:
                    type: array
                    description: Echoed only when an `ids` filter was applied
                    items:
                      type: string
                  restocks:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        restocked_at:
                          type: integer
                        restock_interval_seconds:
                          type: integer
                          nullable: true
                          description: Seconds-until-next-restock observed at capture time
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              item_id:
                                type: string
                                example: "Carrot"
                              stock:
                                type: integer
                                example: 8

  /weather-station:
    get:
      tags:
        - Weather Station
      summary: Weather station dashboard
      description: |
        One request for the whole station: the engine in force now, the current
        event, the next events, the current civil day, and how the engine compares
        with the recorded history over the last 24 hours.

        `Cache-Control: no-store`, because the present moves.
      parameters:
        - name: tz
          in: query
          description: IANA time zone used for the "today" section (default `UTC`).
          schema:
            type: string
            example: Europe/Paris
        - name: engine
          in: query
          description: Era id to replay with, instead of the era covering now. An unknown id is a `BAD_REQUEST` that lists the known ones.
          schema:
            type: string
        - name: upcoming
          in: query
          description: How many upcoming events to include (default 5, capped at 50).
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 5
        - name: enrich
          in: query
          description: Set to `0` to drop per-weather metadata (group, sprite, mutation chance) from the events.
          schema:
            type: string
            enum: ['0']
      responses:
        '200':
          description: The station dashboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  generated_at:
                    type: integer
                    description: Epoch ms this view was computed
                  generated_at_iso:
                    type: string
                    format: date-time
                  engine:
                    type: object
                    description: Era in force (id, label, window) and its drift check against recorded history
                    additionalProperties: true
                  now:
                    type: object
                    description: Current event, or the next one when nothing is active
                    additionalProperties: true
                  next:
                    type: array
                    description: Upcoming events, soonest first
                    items:
                      type: object
                      additionalProperties: true
                  today:
                    type: object
                    description: Current civil day for `tz` (counts and minutes per weather)
                    additionalProperties: true
                  accuracy_24h:
                    type: object
                    description: Engine vs recorded history over the last 24 hours
                    additionalProperties: true

  /weather-station/now:
    get:
      tags:
        - Weather Station
      summary: Current weather and the next event
      description: |
        The light endpoint for polling: the current event with how long it has
        left, and the next one with how long until it starts. `no-store`.

        Live observation wins over the engine while an event is happening; when
        the two disagree, `now.agrees_with_engine` says so rather than one of them
        being picked silently.
      parameters:
        - name: engine
          in: query
          description: Era id to replay with instead of the era covering now.
          schema:
            type: string
        - name: enrich
          in: query
          description: Set to `0` to drop per-weather metadata.
          schema:
            type: string
            enum: ['0']
      responses:
        '200':
          description: Current and next event
          content:
            application/json:
              schema:
                type: object
                properties:
                  generated_at:
                    type: integer
                  generated_at_iso:
                    type: string
                    format: date-time
                  modeled:
                    type: boolean
                    description: True when the answer comes from the deterministic engine rather than observation
                  now:
                    type: object
                    description: Current event, plus `status`, `starts_in_ms`/`ends_in_ms`, `source` and `agrees_with_engine`
                    additionalProperties: true
                  next:
                    type: object
                    description: Next event; absent when the scan finds none
                    additionalProperties: true

  /weather-station/next:
    get:
      tags:
        - Weather Station
      summary: Upcoming occurrences of specific weathers
      description: |
        Scans forward from `from` and returns the next `count` events, optionally
        restricted to the weathers named in `ids`. `complete` says whether the
        requested count was reached before the scan gave up, and `scanned_days`
        reports how far it looked.

        `no-store`.
      parameters:
        - name: ids
          in: query
          description: Comma-separated weather ids or public labels to keep. An unknown name is a `BAD_REQUEST` that names it.
          schema:
            type: string
        - name: count
          in: query
          description: How many events to return (default 5, capped at 50).
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 5
        - name: from
          in: query
          description: Scan start (epoch ms or ISO 8601). Default now.
          schema:
            type: string
        - name: engine
          in: query
          description: Era id to replay with instead of the era covering `from`.
          schema:
            type: string
        - name: enrich
          in: query
          description: Set to `0` to drop per-weather metadata.
          schema:
            type: string
            enum: ['0']
      responses:
        '200':
          description: The next events
          content:
            application/json:
              schema:
                type: object
                properties:
                  from:
                    type: integer
                  count:
                    type: integer
                    description: Number of events actually returned
                  requested:
                    type: integer
                  complete:
                    type: boolean
                  scanned_days:
                    type: integer
                  ids:
                    type: array
                    description: Echoed only when `ids` was given
                    items:
                      type: string
                  events:
                    type: array
                    items:
                      type: object
                      additionalProperties: true

  /weather-station/forecast:
    get:
      tags:
        - Weather Station
      summary: Weather events over a time window
      description: |
        Every event between `from` and `to`, soonest first, capped at `limit`
        (`truncated` says whether the cap bit). The window defaults to the next
        24 hours — a weather station talks about the future by default, unlike
        `/stats`.

        With `include_clear=1` the whole slot-by-slot timeline is returned instead
        of events only, so the clear stretches are visible too. The ETag is
        computed on the *resolved* window, so a request without `from` re-resolves
        as the clock moves rather than serving one forecast forever.
      parameters:
        - name: from
          in: query
          description: Window start (epoch ms or ISO 8601). Default now.
          schema:
            type: string
        - name: to
          in: query
          description: Window end. Default `from` + 24 h. The window is capped at 400 days.
          schema:
            type: string
        - name: ids
          in: query
          description: Comma-separated weather ids or public labels to keep.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum events returned (default 500, capped at 5000).
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 500
        - name: include_clear
          in: query
          description: Set to `1` to return the full timeline, clear skies included, instead of events only.
          schema:
            type: string
            enum: ['1']
        - name: engine
          in: query
          description: Era id to replay with instead of the era covering the window.
          schema:
            type: string
        - name: enrich
          in: query
          description: Set to `0` to drop per-weather metadata.
          schema:
            type: string
            enum: ['0']
      responses:
        '200':
          description: The forecast
          content:
            application/json:
              schema:
                type: object
                properties:
                  from:
                    type: integer
                  to:
                    type: integer
                  engine:
                    type: string
                    nullable: true
                  eras:
                    type: array
                    items:
                      type: string
                  modeled:
                    type: boolean
                  modeled_from:
                    type: string
                  count:
                    type: integer
                  limit:
                    type: integer
                  truncated:
                    type: boolean
                  events:
                    type: array
                    items:
                      type: object
                      additionalProperties: true

  /weather-station/forecast.csv:
    get:
      tags:
        - Weather Station
      summary: Comma-separated export of the forecast
      description: |
        `/weather-station/forecast` as a table, with the same query parameters.
        Each event is one row, keyed by its start instant (`started_at_iso`),
        because two events cannot start at the same time; the weather id keeps its
        own `weather_id` column. The download filename states the resolved window
        in days.

        No `X-Game-Version`: this is a local model, not data from the game bundle.
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /weather-station/forecast.tsv:
    get:
      tags:
        - Weather Station
      summary: Tab-separated export of the forecast
      description: |
        The same rows as `/weather-station/forecast.csv`, with tabs as the
        delimiter. No `X-Game-Version`.
      responses:
        '200':
          description: TSV file
          content:
            text/tab-separated-values:
              schema:
                type: string

  /weather-station/day/{date}:
    get:
      tags:
        - Weather Station
      summary: One civil day of weather
      description: |
        The whole civil day named by `{date}` (`YYYY-MM-DD`) in `tz`: `counts` and
        `minutes` per weather, plus the event timeline clipped to that day. The
        time zone offset is resolved at midday of *that* day, so a DST boundary
        uses the offset in force on the day asked about, not today's.

        An invalid day or an unknown time zone is a `BAD_REQUEST`. A day already
        over caches for 24 hours, a future one revalidates within minutes.
      parameters:
        - name: date
          in: path
          required: true
          description: Civil day, `YYYY-MM-DD`.
          schema:
            type: string
        - name: tz
          in: query
          description: IANA time zone (default `UTC`).
          schema:
            type: string
        - name: engine
          in: query
          description: Era id to replay with.
          schema:
            type: string
        - name: enrich
          in: query
          description: Set to `0` to drop per-weather metadata.
          schema:
            type: string
            enum: ['0']
      responses:
        '200':
          description: The day, minute by minute
          content:
            application/json:
              schema:
                type: object
                properties:
                  day:
                    type: string
                  tz:
                    type: string
                  tz_offset_min:
                    type: integer
                  from:
                    type: integer
                  to:
                    type: integer
                  engine:
                    type: string
                    nullable: true
                  eras:
                    type: array
                    items:
                      type: string
                  modeled:
                    type: boolean
                  modeled_from:
                    type: string
                  counts:
                    type: object
                    description: Events per weather over the day
                    additionalProperties:
                      type: integer
                  minutes:
                    type: object
                    description: Minutes per weather over the day
                    additionalProperties:
                      type: integer
                  timeline:
                    type: array
                    items:
                      type: object
                      additionalProperties: true

  /weather-station/engine:
    get:
      tags:
        - Weather Station
      summary: The era registry and the drift check
      description: |
        The deterministic engine describing itself: the era in force, every era it
        knows with its window and the groups each one deals, the signature that
        changes when the registry changes and that the ETags are built on, and
        `drift` — whether the model still reproduces the recorded history, with a
        reason when it no longer does.

        Public on purpose: it is the record of what the model is, and the drift
        check is the warning that the game changed its scheduler.
      responses:
        '200':
          description: The era registry and its drift check
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /weather-station/accuracy:
    get:
      tags:
        - Weather Station
      summary: Engine vs recorded history over a window
      description: |
        Compares the modeled timeline with the weather events recorded in SQLite
        between `from` and `to`, slot by slot: `covered` (slots history can judge),
        `matched`, `pct` (null until something is covered) and the mismatches
        themselves.

        The window defaults to the last 24 hours and is capped at 31 days. Cached
        for 60 seconds.
      parameters:
        - name: from
          in: query
          description: Window start (epoch ms or ISO 8601). Default `to` − 24 h.
          schema:
            type: string
        - name: to
          in: query
          description: Window end (epoch ms or ISO 8601). Default now.
          schema:
            type: string
      responses:
        '200':
          description: Accuracy over the window
          content:
            application/json:
              schema:
                type: object
                properties:
                  from:
                    type: integer
                  to:
                    type: integer
                  slot_ms:
                    type: integer
                  covered:
                    type: integer
                  matched:
                    type: integer
                  pct:
                    type: number
                    nullable: true
                  mismatches:
                    type: array
                    items:
                      type: object
                      additionalProperties: true

components:
  schemas:
    ComposeLimits:
      description: |
        The limits a scene spec is held to. Declared in `x-mg-contract.compose`, re-served by
        `/schema.json`, and applied by `POST /compose`: a spec over one is refused with a named error
        rather than truncated.
      type: object
      properties:
        spec:
          type: integer
          description: The scene spec version this instance implements
          example: 1
        maxItems:
          type: integer
          description: The most items one spec may state, and the most tiles a background may lay
          example: 256
        maxCanvas:
          type: string
          description: The largest canvas, `<width>x<height>`
          example: "4096x4096"
        maxPixels:
          type: integer
          description: The largest canvas by area
          example: 16777216

    ComposeSpec:
      description: |
        A scene: what to draw, and where. Every value names something the game names — a species, a
        tile column and row, a mutation, a crop's own size on the game's 50-to-100 band, and (spec 2)
        a place **inside** a tile as a fraction of it. **No field is a pixel coordinate**: the API owns
        the reference tile, the slot offsets, the size curve, the rotation and the z-order.

        Spec 2 adds two things and changes nothing else: an optional in-tile place on `at`
        (`x`, `y`, `rotation` — the unit the save states a crop's own place in), and
        `kind: "patch"`, a tile that holds a **cluster** of the species' crops. Spec 1 is still
        accepted and behaves exactly as it did.
      type: object
      required: [spec, items]
      properties:
        spec:
          type: integer
          enum: [2, 1]
          description: The spec version; this instance implements `2` and `1`
          example: 2
        canvas:
          type: object
          properties:
            fit:
              type: string
              enum: ["content"]
              description: Crop the picture to the content plus the padding
            padding:
              type: integer
              minimum: 0
              description: The room left around the content, in the game's own pixels
              example: 16
        background:
          type: object
          description: Tile art the game itself draws, laid out on the tile grid
          properties:
            kind:
              type: string
              enum: ["tiles"]
            ground:
              type: string
              description: A tile's own name in the game's atlas (`Dirt_A`, `Grass_C`, …)
              example: "Dirt_A"
            columns:
              type: integer
              minimum: 1
            rows:
              type: integer
              minimum: 1
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ComposeItem'

    ComposeItem:
      description: |
        One thing in the scene. `kind: "plant"` draws the species' plant with its pot and the crops in
        its slots; `kind: "patch"` draws a cluster of the species' crops on one tile — a patch species
        is one the plant table states `harvestType: "Single"` **and** a `slotCapacity` for, and its
        `crops` are the sprigs, capped by that capacity; `kind: "crop"` is a bare crop — a menu
        picture, a seed packet. Every kind takes an optional `at`, the tile the thing occupies; without
        one the item flows with the rest of the content.
      type: object
      required: [id, species]
      properties:
        id:
          type: string
          description: |
            The caller's own name for the item, echoed in the layout. It is also the **seed** of a
            patch's scatter: the same id lays a patch out the same way every time, which is what keeps
            a content-addressed picture stable.
        kind:
          type: string
          enum: ["plant", "patch", "crop"]
          default: "crop"
        species:
          type: string
          description: The plant table's key, as `/data/plants` states it
          example: "Clover"
        at:
          type: object
          description: |
            The tile the item occupies, and (spec 2) where inside it. `x` and `y` are **fractions of a
            tile** and `rotation` is **degrees**, which is the unit the game's own save states a crop's
            place in; absent means `0`, the tile's middle. A crop's art anchor lands on
            `tileCentre + (x, y) × 256` and the sprite is turned `rotation` degrees about that anchor.
          properties:
            column:
              type: integer
              minimum: 0
            row:
              type: integer
              minimum: 0
            x:
              type: number
              description: Across the tile, as a fraction of it (`0` is the middle)
              example: 0.125
            y:
              type: number
              description: Down the tile, as a fraction of it (`0` is the middle)
              example: -0.25
            rotation:
              type: number
              description: Degrees about the art's own anchor
              example: 12.5
        size:
          type: integer
          minimum: 50
          maximum: 100
          description: |
            The crop's own number, exactly as the wire carries it. The API converts it with the
            game's own curve against the species' multiplier; a spec that states none asks for the
            ripe picture.
        mutations:
          type: array
          items:
            type: string
          description: Mutation names the thing wears. Order is not meaningful and duplicates are dropped.
        potted:
          type: boolean
          default: false
          description: A plant in the game's planter pot
        matured:
          type: boolean
          default: false
          description: A plant that has grown up (its celestial arts and front layer are drawn)
        crops:
          type: array
          description: |
            The crops standing on a `kind: "plant"` item, in the order the save lists them. A
            species whose plant table states `harvestType: "Single"` is a **patch**: its crops are
            the plant, one per slot, and a species that states no `slotCapacity` holds exactly one —
            a second crop on such a tile is a `400` (`COMPOSE_PLANT_OVER_CAPACITY`) rather than a
            pile of two, because that is a picture the game never draws. A `"Single"` species with a
            capacity places its crops by the same scatter a `kind: "patch"` item uses, or squeezes
            them towards the middle when the item is `potted`.
          items:
            type: object
            properties:
              slot:
                type: integer
                minimum: 0
                description: |
                  The slot on the plant, which is what places the crop: the species' plant table
                  gives `slotOffsets[slot]` as the place, and a slot the table does not place is
                  refused by name. A slot may name the species the crop is drawn as
                  (`speciesOverride`), which is how `ThunderCelestial`'s stormcaps are drawn.
              size:
                type: integer
                minimum: 50
                maximum: 100
              mutations:
                type: array
                items:
                  type: string
              startTime:
                type: integer
                description: |
                  When the crop was planted, in milliseconds. Two of the game's own readings come off
                  it: the turn a species that sets `rotateSlotOffsetsRandomly` gives each of its crops
                  (`slotRotation + 35 − startTime % 70` degrees, so two tomatoes on one vine sit at
                  different angles and the same crop looks the same every time it is drawn), and the
                  start of the window its growth is measured across. Absent is read as `0`.
              endTime:
                type: integer
                description: The end of that window, in the same clock as `startTime`
              remainingMs:
                type: integer
                description: |
                  How much of the window is left, which is where the crop is *now*: the API reads the
                  moment as `endTime − remainingMs` and draws the crop at `size × growth`. A crop that
                  states a window and no `remainingMs` is drawn ripe, because nothing says when it is.
              ready:
                type: boolean
                description: The crop has ripened, whatever the arithmetic says. Wins over the window.
              flipped:
                type: boolean
                default: false
                description: |
                  A mirrored crop. The game turns it the other way and moves its pivot the other
                  way, which the layout applies; the mirror of the art itself is not drawn yet, so
                  the geometry is the game's and the pixels are not.
        startTime:
          type: integer
          description: |
            When a still-growing crop started. Its own growth window is `startTime` to `endTime`, and
            where it is *now* is `remainingMs`: the API draws it at `size × growth` on the game's own
            curve (`growth.js`), 0.7 of the way up by the time the window ends and 1 once it has.
        endTime:
          type: integer
          description: When the window ends
        remainingMs:
          type: integer
          description: |
            How much of the window is left. Without it (and without `ready`) a crop is drawn ripe:
            there is nothing to say about when it is.
        ready:
          type: boolean
          description: Ask for the ripe picture whatever the window says

    SceneLayout:
      description: |
        The boxes the picture was drawn into, in the picture's own pixels (`box`) and in the scene's
        own coordinates (`scene`), where `column × grid.step, row × grid.step` is the tile an item
        named. A consumer keeps its interactivity from these: a countdown ring, a hover target and a
        detail dialog each need a box.
      type: object
      properties:
        spec:
          type: integer
          example: 1
        key:
          type: string
          description: The same value the response states in `X-MG-Compose-Key`
        canvas:
          type: object
          properties:
            width:
              type: integer
            height:
              type: integer
            origin:
              type: object
              description: Where the scene's own origin (column 0, row 0) sits in the picture
              properties:
                x:
                  type: integer
                y:
                  type: integer
            grid:
              type: object
              properties:
                step:
                  type: integer
                  example: 256
                columns:
                  type: integer
                  nullable: true
                rows:
                  type: integer
                  nullable: true
            fit:
              type: string
            padding:
              type: integer
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              kind:
                type: string
              species:
                type: string
              box:
                $ref: '#/components/schemas/Box'
              scene:
                $ref: '#/components/schemas/Box'
              z:
                type: integer
                description: |
                  The game's own layer for this kind of thing: `3` (`OccludingObject`) for a plant or
                  a patch standing on a tile, `2` (the `mounted crop` rung) for a bare crop. It is one
                  term of the world depth key the painting order comes from — a thing lower on the
                  screen is painted in front of one behind it — so it is not the order by itself;
                  `layout.items` is in the spec's normalised (id) order, and the order the picture was
                  painted in is the world key over `z` and the item's tile.
              sprites:
                type: array
                items:
                  type: string
              crops:
                type: array
                description: |
                  The crops standing on the item, in the order the game stacks them — a patch by each
                  sprig's own `y` place, a plant by the slot it grew in (`2 + slotId`), which is the
                  `depth` below. A plant's crop is placed by its slot: its place is the blueprint's
                  `slotOffsets[slot]` moved by the crop's pivot, and `species` says which species it
                  is drawn as, which a slot may override (`ThunderCelestial`'s stormcaps).
                items:
                  type: object
                  properties:
                    slot:
                      type: integer
                      description: The crop's own `slotId`, which is the key into the blueprint's `slotOffsets`
                    species:
                      type: string
                      nullable: true
                      description: |
                        The species the crop is drawn as: the item's own, or the one the slot's
                        `speciesOverride` names. Its art, its `maxSizeMultiplier` and its
                        `plantTransform` are that species', while the tilt is the plant's.
                    place:
                      type: object
                      description: |
                        Where the crop's art **anchor** lands in the tile, as tile fractions, and the
                        degrees it is turned by. That is the point `plantPicture` laid the frame out
                        on — the tile's middle, the blueprint's slot offset, the crop's pivot shift,
                        and whatever the scatter gave a patch sprig — so it is the number to read to
                        check an anchor without decoding a pixel.
                      properties:
                        x:
                          type: number
                        y:
                          type: number
                        rotation:
                          type: number
                    depth:
                      type: integer
                      description: |
                        The crop's turn in the stack inside its item, which is the game's own crop
                        `zIndex`: `2 + slotId` on a plant, `Math.round((y + 1) * 10)` on a patch.
                        Tiles themselves stack by the game's world depth key, lowest drawn last.
                    scale:
                      type: number
                    box:
                      $ref: '#/components/schemas/Box'
                    scene:
                      $ref: '#/components/schemas/Box'
        background:
          type: object
          nullable: true
          properties:
            ground:
              type: string
            columns:
              type: integer
            rows:
              type: integer
            sprite:
              type: string

    Box:
      description: A rectangle in the picture's own pixels
      type: object
      required: [x, y, width, height]
      properties:
        x:
          type: integer
        y:
          type: integer
        width:
          type: integer
        height:
          type: integer

    PlantData:
      type: object
      description: Complete plant lifecycle data (seed → plant → crop)
      properties:
        seed:
          type: object
          description: Seed stage information
          properties:
            name:
              type: string
              example: "Carrot Seed"
            coinPrice:
              type: integer
              description: Purchase price in coins
              example: 10
            sprite:
              type: string
              format: uri
              description: Absolute URL to seed sprite
              example: "/assets/sprites/seeds/Carrot.png"
        plant:
          type: object
          description: Growing plant stage information
          properties:
            name:
              type: string
              example: "Carrot Plant"
            harvestType:
              type: string
              enum: ["Single", "Multi"]
              description: Single harvest or multiple harvests
              example: "Single"
            sprite:
              type: string
              format: uri
              description: Absolute URL to plant sprite
              example: "/assets/sprites/plants/BabyCarrot.png"
        crop:
          type: object
          description: Harvested crop information
          properties:
            name:
              type: string
              example: "Carrot"
            baseSellPrice:
              type: integer
              description: Base sell price (can be affected by quality)
              example: 20
            sprite:
              type: string
              format: uri
              description: Absolute URL to crop sprite
              example: "/assets/sprites/plants/Carrot.png"

    PetData:
      type: object
      description: Pet companion data
      properties:
        name:
          type: string
          example: "Bunny"
        coinPrice:
          type: integer
          description: Purchase price in coins
          example: 500
        ability:
          type: string
          description: Special ability ID
          example: "HarvestBoost"
        sprite:
          type: string
          format: uri
          description: Absolute URL to pet sprite
          example: "/assets/sprites/pets/Bunny.png"
        released:
          type: boolean
          description: |
            Only present, and always `false`, on species that exist in the
            game's Rive file but have no game data yet. Absent means the pet is
            live. Filter on it if you are building a shop; keep them if you are
            building a bestiary.
          example: false
        rive:
          $ref: '#/components/schemas/RiveSource'
        animations:
          type: object
          description: |
            Looping animations for this species, keyed by clip (`idle`, `walk`,
            `eat`, `sleep`). Absent when none have been generated - it is a
            bonus, never a contract. See `/assets/animations`.
          additionalProperties:
            $ref: '#/components/schemas/PetAnimationLink'
          example:
            idle:
              url: "/assets/animations/pets/Bunny_idle.webp?v=824"
              format: "webp"
              width: 198
              height: 257
              frames: 210
              fps: 30
              durationMs: 7000
              anchor:
                x: 0.5
                y: 1

    RiveFile:
      type: object
      description: One Rive file from the game's manifest, and what it contains
      properties:
        key:
          type: string
          description: Stable key, taken from the filename (not the alias, which the game can rename)
          example: "pets"
        aliases:
          type: array
          items:
            type: string
          example: ["rive/pets.riv", "rive/pets"]
        bundle:
          type: string
          description: Manifest bundle declaring it - only `pets` and `avatar` live in `default`
          example: "default"
        url:
          type: string
          format: uri
          description: Fetchable from a browser, through `/assets/proxy`
        origin:
          type: string
          format: uri
          description: Upstream URL, versioned by content hash
        bytes:
          type: integer
          example: 3085491
        loadable:
          type: boolean
          description: Whether the pinned runtime can read the file
          example: true
        error:
          type: string
          description: Present when `loadable` is false
        defaultArtboard:
          type: string
          description: Container artboard the game never renders directly
          example: "Pets"
        artboardCount:
          type: integer
          example: 29
        timelineCount:
          type: integer
          example: 638
        artboards:
          description: |
            Artboard names by default; full objects with `?full=1` or `?key=`.
          oneOf:
            - type: array
              items:
                type: string
            - type: array
              items:
                $ref: '#/components/schemas/RiveArtboard'
        inspectedAt:
          type: string
          format: date-time

    RiveArtboard:
      type: object
      properties:
        name:
          type: string
          example: "Chicken"
        width:
          type: number
          example: 600
        height:
          type: number
          example: 850
        animations:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: "Pet_Idle"
              frames:
                type: integer
                example: 420
              fps:
                type: number
                example: 60
              durationMs:
                type: integer
                example: 7000
        stateMachines:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: "Pet State Machine"
              inputs:
                type: array
                description: |
                  `type` is the part that matters: a `trigger` cannot be set like
                  a `boolean`, and asking for the wrong one fails silently.
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      example: "sleep"
                    type:
                      type: string
                      enum: [boolean, trigger, number, unknown]
                      example: "boolean"

    RiveSource:
      type: object
      description: |
        The game's vector source for this pet, for clients that can run the Rive
        runtime. One 3 MB file holds every species and all ~22 of their
        timelines, at any resolution and frame rate - where the same coverage as
        pre-encoded WebP would run to hundreds of megabytes.

        `artboard` and `stateMachine` are the parts that cannot be guessed, and
        that a client must never hardcode: they change with the game.
      properties:
        url:
          type: string
          format: uri
          description: |
            Fetchable from a browser - it goes through `/assets/proxy`, which
            adds the CORS headers magicgarden.gg does not send.
          example: "/assets/proxy?url=https%3A%2F%2Fmagicgarden.gg%2Fruntime-assets%2Fpets.bfec8b856f6e2b0e4a83.riv"
        origin:
          type: string
          format: uri
          description: Upstream URL, versioned by content hash
          example: "https://magicgarden.gg/runtime-assets/pets.bfec8b856f6e2b0e4a83.riv"
        artboard:
          type: string
          description: Artboard to instantiate for this species
          example: "Chicken"
        stateMachine:
          type: string
          description: State machine that sets the pet's scale and hides its ground shadow
          example: "Pet State Machine"

    PetAnimationLink:
      type: object
      description: One looping animation of a pet, as served to clients
      properties:
        url:
          type: string
          format: uri
          description: The animation link, in the primary format (WebP by default)
          example: "/assets/animations/pets/Chicken_idle.webp?v=824"
        format:
          type: string
          description: Format `url` points to
          example: "webp"
        gif:
          type: string
          format: uri
          description: Only present when the server also generates GIFs
        timeline:
          type: string
          description: |
            Rive timeline this loop was rendered from - what to play to
            reproduce it live from `rive.url`.
          example: "Pet_Idle"
        width:
          type: integer
          example: 212
        height:
          type: integer
          example: 257
        frames:
          type: integer
          example: 210
        fps:
          type: number
          example: 30
        durationMs:
          type: integer
          description: Length of one full loop
          example: 7000
        anchor:
          type: object
          description: Placement anchor - `x` is always 0.5, `y` is the ground line
          properties:
            x:
              type: number
              example: 0.5
            y:
              type: number
              example: 1

    PetAnimation:
      type: object
      description: Catalog entry for one looping animation
      properties:
        category:
          type: string
          example: "pets"
        name:
          type: string
          description: Artboard name (species, or weather variant)
          example: "Chicken"
        clip:
          type: string
          enum: [idle, walk, eat, sleep]
          example: "idle"
        timeline:
          type: string
          description: Rive timeline the loop was rendered from
          example: "Pet_Idle"
        url:
          type: string
          format: uri
          example: "/assets/animations/pets/Chicken_idle.webp?v=824"
        format:
          type: string
          description: Format `url` points to
          example: "webp"
        gif:
          type: string
          format: uri
          description: Only present when the server also generates GIFs
        width:
          type: integer
          example: 212
        height:
          type: integer
          example: 257
        frames:
          type: integer
          example: 210
        fps:
          type: number
          example: 30
        durationMs:
          type: integer
          example: 7000
        anchor:
          type: object
          properties:
            x:
              type: number
            y:
              type: number
        bytes:
          type: object
          description: File size per format
          additionalProperties:
            type: object
            properties:
              bytes:
                type: integer

    ItemData:
      type: object
      description: Item/tool data
      properties:
        name:
          type: string
          example: "Watering Can"
        type:
          type: string
          enum: ["tool", "consumable"]
          example: "tool"
        coinPrice:
          type: integer
          description: Purchase price in coins
          example: 100
        sprite:
          type: string
          format: uri
          description: Absolute URL to item sprite
          example: "/assets/sprites/items/WateringCan.png"

    HealthStatus:
      type: object
      description: Comprehensive health status of the API server
      properties:
        status:
          type: string
          description: Overall health status
          enum: ["ok", "degraded", "error"]
          example: "ok"
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the health check
          example: "2024-01-20T10:30:00.000Z"
        uptime:
          type: integer
          description: Server uptime in seconds since startup
          example: 3600
        cache:
          type: object
          description: Cache status information
          properties:
            hasBundleCached:
              type: boolean
              description: Whether the game bundle is cached
              example: true
            bundleUrl:
              type: string
              description: URL of the cached bundle
              example: "https://magicgarden.gg/version/642/assets/main-D3Z0cIc_.js"
            bundleFetchedAt:
              type: string
              format: date-time
              description: When the bundle was last fetched
              example: "2024-01-20T10:00:00.000Z"
            bundleAge:
              type: integer
              description: Bundle age in milliseconds
              example: 180000
            categoriesCached:
              type: array
              description: List of successfully cached data categories
              items:
                type: string
              example: ["plants", "pets", "items", "decor", "eggs", "mutations", "abilities"]
        animations:
          type: object
          description: Pet animation rendering status
          properties:
            exportRunning:
              type: boolean
              description: Whether looping pet animations are currently being re-rendered in the background
              example: false
      example:
        status: "ok"
        timestamp: "2024-01-20T10:30:00.000Z"
        uptime: 3600
        animations:
          exportRunning: false
        cache:
          hasBundleCached: true
          bundleUrl: "https://magicgarden.gg/version/642/assets/main-D3Z0cIc_.js"
          bundleFetchedAt: "2024-01-20T10:00:00.000Z"
          bundleAge: 180000
          categoriesCached: ["plants", "pets", "items", "decor", "eggs", "mutations", "abilities"]

    Shops:
      type: object
      description: |
        All shop inventories, keyed by shop type. Shop types are not hardcoded:
        whatever the game exposes is served, so a new shop appears on its own.
      properties:
        seed:
          description: Seed shop (plants and crops)
          $ref: '#/components/schemas/Shop'
        tool:
          description: Tool shop (equipment, consumables and some decor)
          $ref: '#/components/schemas/Shop'
        egg:
          description: Egg shop (pet eggs)
          $ref: '#/components/schemas/Shop'
        decor:
          description: Decoration shop (cosmetic items)
          $ref: '#/components/schemas/Shop'
        dawn:
          description: Event shop, open during Dawn weather
          $ref: '#/components/schemas/Shop'
        snow:
          description: Event shop, open during Snow weather
          $ref: '#/components/schemas/Shop'
        thunder:
          description: Event shop, open during Thunderstorm weather
          $ref: '#/components/schemas/Shop'
        apology:
          description: Occasional compensation shop, opened by the game's operators
          $ref: '#/components/schemas/Shop'
      example:
        seed:
          open: true
          nextRestockAt: "2026-08-07T16:00:00.000Z"
          secondsUntilRestock: 188
