  /data/plants.csv:
    get:
      tags:
        - CSV / TSV Export
      summary: "CSV / TSV export: just append .csv or .tsv to any data or live URL"
      description: |
        Every `/data/*` and `/live/*` endpoint is also available as **CSV** (`text/csv`) or **TSV**
        (`text/tab-separated-values`) by appending `.csv` or `.tsv` to the URL.

        **Available exports:**
        ```
        /data.csv             /data.tsv
        /data/plants.csv      /data/plants.tsv
        /data/pets.csv        /data/pets.tsv
        /data/items.csv       /data/items.tsv
        /data/decors.csv      /data/decors.tsv
        /data/eggs.csv        /data/eggs.tsv
        /data/mutations.csv   /data/mutations.tsv
        /data/abilities.csv   /data/abilities.tsv
        /data/weathers.csv    /data/weathers.tsv
        /data/weather-groups.csv  /data/weather-groups.tsv
        /live.csv             /live.tsv
        /live/weather.csv     /live/weather.tsv
        /live/shops.csv       /live/shops.tsv
        ```

        Nested fields are flattened with dot notation (`seed.name`, `plant.harvestType`, …).
        Arrays are serialized as JSON strings within cells.
        The combined `/data.csv` includes a `category` column.

        Every `/data/*` export carries `X-Game-Version` (`/live/*` exports do not:
        live data is polled, not extracted from the bundle), and none carries
        `_meta`: `jsonToDelimited` turns each top-level key into a table row, so a
        metadata key would add an empty column to every entity and one row with no
        data.

        **Google Sheets:** `=IMPORTDATA("/data/plants.csv")`

        **Excel:** Data > From Web > paste the `.csv` URL
      responses:
        '200':
          description: CSV file
          headers:
            X-Game-Version:
              $ref: '#/components/headers/GameVersion'
          content:
            text/csv:
              schema:
                type: string
              example: |
                id,seed.name,seed.coinPrice,plant.harvestType,crop.baseSellPrice
                Carrot,Carrot Seed,10,Single,20
                Cabbage,Cabbage Seed,30,Multiple,42

