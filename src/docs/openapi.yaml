                      type: string
                  currency:
                    type: array
                    items:
                      type: string
                  eligibleShops:
                    type: array
                    items:
                      type: string
                  itemType:
                    type: array
                    items:
                      type: string
                  weather:
                    type: array
                    items:
                      type: string
                  mutationTierOrder:
                    type: array
                    items:
                      type: string
              examples:
                enums:
                  summary: Example enums payload
                  value:
                    rarity: ["Common", "Uncommon", "Rare", "Legendary", "Mythical", "Divine", "Celestial"]
                    currency: ["coins", "credits", "magicDust"]
                    eligibleShops: ["seed", "egg", "tool", "decor", "rain", "dawn", "amber", "snow", "thunder", "apology"]
                    itemType: ["Seed", "Produce", "Plant", "Tool", "Pet", "Egg", "Decor"]
                    weather: ["Rain", "Frost", "Thunderstorm", "Dawn", "AmberMoon"]
                    mutationTierOrder: ["Wet", "Chilled", "Frozen", "Thunderstruck", "Dawnlit", "Ambershine", "Dawncharged", "Ambercharged"]
        '304':
