                          end: 1.8
                          duration: 0.6

  /assets/sprites:
    get:
      tags:
        - Assets
      summary: Full sprite catalog with ready-to-use PNG URLs
      description: |
        Returns the complete catalog of exported sprites, grouped by category,
        with a ready-to-use PNG URL for each one. Around 600 sprites in total.

        Want a subset? Filter with `cat` (one category) and/or `search`
        (case-insensitive match on the sprite name).

        **Available categories:**
        - `seeds` - Seed sprites
        - `plants` - Plant growth stages
        - `tallPlants` - Tall plant varieties
        - `mutations` - Mutation variants
        - `pets` - Pet companions
        - `pet-cosmetic` - Hats and accessories pets can wear
        - `decor` - Garden decorations
        - `items` - Tools and consumables
        - `objects` - Interactive objects
        - `ui` - UI elements
        - `animations` - Animation frames
        - `weather` - Weather effects
        - `tiles` - Ground tiles
        - `winter` - Winter seasonal sprites

        **Use cases:**
        - Discover every sprite the game currently ships
        - Build sprite pickers or galleries without hardcoding names
        - Find a sprite's exact filename before calling `/assets/sprites/{category}/{name}`

        **Examples:**
        - `/assets/sprites` - everything
        - `/assets/sprites?cat=pets` - all pet sprites
        - `/assets/sprites?search=carrot` - anything named like "carrot", across categories

        **Response notes:**
        - `baseUrl` reflects the public API base used for sprite URLs (`SPRITES_BASE_URL`).
        - URLs include a `?v=<gameVersion>` cache-busting parameter.
        - `categories` always lists every valid category, even when you filter.
      parameters:
        - name: cat
          in: query
          required: false
          schema:
            type: string
            enum: [seeds, plants, tallPlants, mutations, pets, pet-cosmetic, decor, items, objects, ui, animations, weather, tiles, winter]
          description: Only return sprites from this category
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive substring match on sprite names
          example: "carrot"
      responses:
        '200':
          description: Sprite catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    description: Number of sprites in the response (after filters)
                    example: 600
                  baseUrl:
                    type: string
                    description: Base URL for the API
                    example: ""
                  categories:
                    type: array
                    items:
                      type: string
                    description: Every valid category (not affected by filters)
                    example: ["animations", "decor", "items", "mutations", "objects", "pets", "plants", "seeds", "tallPlants", "tiles", "ui", "weather", "winter"]
                  sprites:
                    type: object
                    description: Sprites grouped by category, each with a ready-to-use PNG URL
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            example: "Carrot"
                          url:
                            type: string
                            example: "/assets/sprites/seeds/Carrot.png?v=642"
              examples:
                filtered:
                  summary: Filtered catalog (?search=carrot)
                  value:
                    count: 3
                    baseUrl: ""
                    categories: ["animations", "decor", "items", "mutations", "objects", "pets", "plants", "seeds", "tallPlants", "tiles", "ui", "weather", "winter"]
                    sprites:
                      plants:
                        - name: "BabyCarrot"
                          url: "/assets/sprites/plants/BabyCarrot.png?v=642"
                        - name: "Carrot"
                          url: "/assets/sprites/plants/Carrot.png?v=642"
                      seeds:
                        - name: "Carrot"
                          url: "/assets/sprites/seeds/Carrot.png?v=642"
        '400':
          description: Unknown category in `cat`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /assets/sprites/{category}/{name}:
    get:
      tags:
        - Assets
      summary: Download sprite file
      description: |
        Download a specific sprite as a PNG file.

        **Usage:**
        - Sprites are returned as binary PNG images
        - Can be used directly in `<img>` tags
        - Suitable for downloading to disk

        **Examples:**
        - `/assets/sprites/seeds/Carrot.png` - Carrot seed sprite
        - `/assets/sprites/pets/Bunny.png` - Bunny pet sprite
        - `/assets/sprites/plants/Cabbage.png` - Cabbage crop sprite

        **Integration examples:**

        **HTML:**
        ```html
        <img src="/assets/sprites/seeds/Carrot.png" alt="Carrot Seed">
        ```

        **JavaScript:**
        ```javascript
        const spriteUrl = '/assets/sprites/seeds/Carrot.png';
        const img = new Image();
        img.src = spriteUrl;
        ```

        **Download with cURL:**
        ```bash
        curl /assets/sprites/seeds/Carrot.png -o carrot.png
        ```

        **Python:**
        ```python
        import requests
        response = requests.get('/assets/sprites/seeds/Carrot.png')
        with open('carrot.png', 'wb') as f:
            f.write(response.content)
        ```
      parameters:
        - name: category
          in: path
          required: true
          description: Sprite category (seeds, plants, pets, etc.)
          schema:
            type: string
            enum: ["seeds", "plants", "tallPlants", "mutations", "pets", "pet-cosmetic", "decor", "items", "objects", "ui", "animations", "weather", "tiles", "winter"]
          example: "seeds"
        - name: name
          in: path
          required: true
          description: Sprite filename (must end with .png)
          schema:
            type: string
            pattern: '^[^/\\]+\.png$'
          example: "Carrot.png"
      responses:
        '200':
          description: Sprite PNG file
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid category or filename
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidCategory:
                  summary: Invalid category
                  value:
                    error:
                      code: "BAD_REQUEST"
                      message: "Invalid category 'invalid_cat'. Allowed: seeds, plants, tallPlants, mutations, pets, decor, items, objects, ui, animations, weather, tiles, winter"
        '404':
          description: Sprite not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  summary: Sprite not found
                  value:
                    error:
                      code: "NOT_FOUND"
                      message: "Sprite not found: seeds/NonExistent.png"

  /assets/animations:
    get:
      tags:
        - Assets
      summary: Catalog of animated pet loops (WebP/GIF)
      description: |
        Everything the game animates is vector art, so beyond the still PNGs
        this API serves those subjects **animated**: one looping WebP (or GIF)
        per subject and per state.

        Two categories:
        - `pets` - one loop per species and per state (`idle`, `walk`, `eat`,
          `sleep`), plus the two weather variants.
        - `decor` - the eight animated garden decorations (windmill, fountain,
          cauldron, …). Each has a single continuous loop, keyed `loop`.

        Loops are pre-rendered whenever the game ships a new pet file - never
        on request - and served as plain files. Drop the URL in an `<img>` tag
        and it plays; there is no runtime to embed.

        **Clips:**
        - `idle` - the resting loop, 7 s
        - `walk` - one step cycle, ~0.6 s
        - `eat` - eating, 1 s
        - `sleep` - sleeping, 8 s

        Not every species exposes every clip, and the two weather variants
        (`FireHorseActive`, `ThunderWolfActive`) only ship `idle`. Decor clip
        names are taken from what each artboard declares, never hardcoded - the
        game's own timeline names are inconsistent.

        **Filters:** `cat`, `name` (exact species), `clip`, `search`
        (case-insensitive substring on the species name).

        **Response notes:**
        - Every loop is rendered to the same subject height, so species stay
          visually comparable - a snail and a horse come out the same size.
        - `url` is the link, in the primary format (WebP by default); `format`
          names it, and any additional format appears under its own key
          (`gif`).
        - `anchor` places the sprite like the game does: `x` is always 0.5,
          `y` marks the ground line under the pet's feet.
        - `source.generatedAt` tells you when the loops were last rendered, and
          `source.riveUrl` which game file they came from.
        - Not to be confused with the `animations` **sprite** category
          (`/assets/sprites/animations/*.png`), which holds still frames from
          the game's atlases.
      parameters:
        - name: cat
          in: query
          required: false
          schema:
            type: string
            enum: [pets, decor]
          description: Only return animations from this category
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Exact species name (case-insensitive)
          example: "Chicken"
        - name: clip
          in: query
          required: false
          schema:
            type: string
            enum: [idle, walk, eat, sleep, loop]
          description: Only return this clip (`loop` for decor)
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive substring match on species names
          example: "horse"
      responses:
        '200':
          description: Animation catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 118
                  baseUrl:
                    type: string
                    example: ""
                  categories:
                    type: array
                    items:
                      type: string
                    example: ["pets", "decor"]
                  formats:
                    type: array
                    items:
                      type: string
                    description: Formats currently generated
                    example: ["webp"]
                  sources:
                    type: object
                    description: |
                      One entry per category - each comes from its own Rive file,
                      and their exports do not finish at the same time.
                    additionalProperties:
                      type: object
                      properties:
                        riveUrl:
                          type: string
                          description: Game file the loops were rendered from
                        generatedAt:
                          type: string
                          format: date-time
                  animations:
                    type: object
                    description: Animations grouped by category
                    additionalProperties:
                      type: array
                      items:
                        $ref: '#/components/schemas/PetAnimation'
              examples:
                filtered:
                  summary: One species (?name=Chicken)
                  value:
                    count: 4
                    baseUrl: ""
                    categories: ["pets"]
                    formats: ["webp"]
                    sources:
                      pets:
                        riveUrl: "https://magicgarden.gg/runtime-assets/pets.bfec8b856f6e2b0e4a83.riv"
                        generatedAt: "2026-08-04T18:21:07.633Z"
                    animations:
                      pets:
                        - category: "pets"
                          name: "Chicken"
                          clip: "idle"
                          timeline: "Pet_Idle"
                          url: "/assets/animations/pets/Chicken_idle.webp?v=824"
                          format: "webp"
                          width: 212
                          height: 257
                          frames: 210
                          fps: 30
                          durationMs: 7000
                          anchor:
                            x: 0.5
                            y: 1
        '400':
          description: Unknown category in `cat`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /assets/animations/{category}/{file}:
    get:
      tags:
        - Assets
      summary: Download an animated loop
      description: |
        Download one looping animation as an animated WebP or GIF. The filename
        is `<Species>_<clip>.<webp|gif>`.

        WebP is the format to prefer: 8-bit alpha (these sprites have soft
        edges and translucent shadows) and about half the bytes of the
        equivalent GIF. GIF is only generated when the server is configured for
        it, and pays for compatibility with a 256-colour palette and 1-bit
        transparency.

        **Examples:**
        - `/assets/animations/pets/Chicken_idle.webp` - chicken, idle loop
        - `/assets/animations/pets/Horse_walk.webp` - horse, one step cycle
        - `/assets/animations/pets/ThunderWolfActive_idle.webp` - thunder wolf under active weather
        - `/assets/animations/decor/MarbleFountain_loop.webp` - the fountain running

        **HTML:**
        ```html
        <img src="/assets/animations/pets/Chicken_idle.webp" alt="Chicken">
        ```

        The file loops forever on its own - no JavaScript, no Rive runtime.
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
            enum: [pets, decor]
          example: "pets"
        - name: file
          in: path
          required: true
          description: "`<Species>_<clip>.<webp|gif>`"
          schema:
            type: string
            pattern: '^[A-Za-z0-9-]+_[a-z0-9]+\.(webp|gif)$'
          example: "Chicken_idle.webp"
      responses:
        '200':
          description: Animated image
          content:
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid category or filename
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Animation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  summary: Species has no such clip
                  value:
                    error:
                      code: "NOT_FOUND"
                      message: "Animation not found: pets/Chicken_dance.webp"

  /assets/rive:
    get:
      tags:
        - Assets
      summary: The game's Rive (vector) files and what they contain
      description: |
        Everything that moves in the game is vector art, rendered live by a Rive
        runtime: the pets, but also the animated decor, the thought bubble, the
        coin and the gift box. This endpoint publishes the files themselves and
        an inventory of what is inside them.

        **Why you may want the file rather than the images.** `pets.riv` is
        3 MB and holds all 28 species with about 660 timelines, at any
        resolution and frame rate. The equivalent coverage as pre-encoded WebP
        would run to hundreds of megabytes. If your client can run the Rive
        runtime, play the source; if it can only show a picture, use
        `/assets/animations`.

        **What the inventory is for.** Artboard names, state machine names,
        timeline names and - above all - **the type of every state machine
        input**. Half of a pet's inputs are *triggers* (`walk`, `eat`,
        `petted`), not booleans (`sleep`, `fire`, `thunder`), and asking for the
        wrong one fails silently. All of it changes with game updates, so
        nothing here should ever be hardcoded by a client.

        **Notes:**
        - `url` goes through `/assets/proxy`, which adds the CORS headers
          magicgarden.gg does not send - a browser cannot fetch `origin`
          directly.
        - `origin` is versioned by content hash, so it changes on every update.
        - `loadable: false` means our pinned runtime cannot read the file.
          `avatar.riv` is permanently in this state: it references assets stored
          outside the file (the cosmetics bundle) and never finishes loading.
        - The inventory is refreshed during sprite sync, never per request:
          inspecting a file costs a download and a WASM pass.
      parameters:
        - name: key
          in: query
          required: false
          schema:
            type: string
          description: Return a single file, with full artboard detail
          example: "pets"
        - name: full
          in: query
          required: false
          schema:
            type: string
            enum: ["1"]
          description: Include every artboard's timelines and state machines
      responses:
        '200':
          description: Rive inventory
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 6
                  baseUrl:
                    type: string
                    example: ""
                  generatedAt:
                    type: string
                    format: date-time
                    description: When the inventory was last refreshed
                  files:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/RiveFile'
              examples:
                summary:
                  summary: Default view
                  value:
                    count: 6
                    baseUrl: ""
                    generatedAt: "2026-08-04T18:25:17.004Z"
                    files:
                      pets:
                        key: "pets"
                        aliases: ["rive/pets.riv", "rive/pets"]
                        bundle: "default"
                        url: "/assets/proxy?url=https%3A%2F%2Fmagicgarden.gg%2Fruntime-assets%2Fpets.bfec8b856f6e2b0e4a83.riv"
                        origin: "https://magicgarden.gg/runtime-assets/pets.bfec8b856f6e2b0e4a83.riv"
                        bytes: 3085491
                        loadable: true
                        artboardCount: 29
                        timelineCount: 638
                        artboards: ["Pets", "Pig", "Horse", "Chicken"]
                      avatar:
                        key: "avatar"
                        bundle: "default"
                        loadable: false
                        error: "Rive load timed out after 20000ms"
        '404':
          description: Unknown `key`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /assets/sprites/composed:
    get:
      tags:
        - Assets
      summary: Get pre-composed sprite with mutations
      description: |
        Returns a single PNG with all mutation layers pre-rendered on top of the base sprite.

        The pipeline applies (bottom → top):
        1. Color filters (tint/gradient per mutation)
        2. Base sprite
        3. Mutation icons
        4. Tall-plant overlays (masked to base silhouette, tall plants only)
        5. Floating icons (Dawnlit, Ambershine, Dawncharged, Ambercharged)

        The picture is the **tight union** of the crop's own art and every layer drawn over it:
        an icon that reaches past the crop's frame grows the picture instead of being clipped
        to it, so the image dimensions are the union's, not the crop art's. The one exception
        is the tall-plant overlay (`sprite/mutation-overlay/*TallPlant`, tall plants only),
        which the game itself masks to the crop body's own texture: that layer is still cut to
        the crop art's rectangle and never changes the picture's size.

        The box is stated rather than assumed, in two forms of the same fact:
        `X-MG-Sprite-Box: x,y,width,height` on the response, and `?format=layout` for the
        same box as a JSON body. It is the **crop art's own rectangle inside the picture** —
        `width`/`height` are the art's, `x`/`y` the corner it sits at, so a caller places the
        picture on a tile with the art where it belongs. The JSON form is the one a
        cross-origin page can read: the header is deliberately *not* in
        `Access-Control-Expose-Headers`, so a browser asks for the layout instead of trying to
        read a header it was never given.

        **Mutations supported:** `Gold`, `Rainbow`, `Wet`, `Chilled`, `Frozen`, `Thunderstruck`,
        `Dawnlit`, `Ambershine`, `Dawncharged`, `Ambercharged`

        Unknown mutation ids are silently ignored.

        **Examples:**
        - `/assets/sprites/composed?key=sprite/plant/Cactus&mutations=Rainbow,Wet`
        - `/assets/sprites/composed?key=sprite/plant/Carrot&mutations=Gold`
        - `/assets/sprites/composed?key=sprite/pet/Bunny&mutations=Dawnlit,Ambershine`

        **Caching:** `public, max-age=86400, stale-while-revalidate=3600`
      parameters:
        - name: key
          in: query
          required: true
          description: Full atlas key of the base sprite (e.g. `sprite/plant/Cactus`, `sprite/plant/Carrot`, `sprite/pet/Bunny`)
          schema:
            type: string
          example: "sprite/plant/Cactus"
        - name: mutations
          in: query
          required: false
          description: Comma-separated list of mutation ids (order-insensitive, deduplicated server-side)
          schema:
            type: string
          example: "Rainbow,Wet"
        - name: format
          in: query
          required: false
          description: |
            `layout` (case-insensitive) answers the box as a JSON body instead of a PNG:
            the form a cross-origin caller can read, and the one that can be asserted as
            numbers without decoding an image. Omitted, or any other value, returns the
            picture.
          schema:
            type: string
            enum: ["layout"]
          example: "layout"
      responses:
        '200':
          description: Composed PNG, or the box as JSON with `format=layout`
          headers:
            X-MG-Sprite-Box:
              $ref: '#/components/headers/SpriteBox'
          content:
            image/png:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/SpriteLayout'
              examples:
                layout:
                  summary: The box `X-MG-Sprite-Box` states, as a readable body
                  value:
                    key: "sprite/plant/Carrot"
                    mutations: ["Ambercharged"]
                    box:
                      x: 0
                      y: 50
                      width: 191
                      height: 238
        '400':
          description: Missing or invalid `key` parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingKey:
                  summary: Missing key
                  value:
                    error:
                      code: "BAD_REQUEST"
                      message: "Missing required query param: key"
                invalidKey:
                  summary: Invalid key format
                  value:
                    error:
                      code: "BAD_REQUEST"
                      message: "Invalid key format"
        '404':
          description: Base sprite not found in atlas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  summary: Sprite not found
                  value:
                    error:
                      code: "NOT_FOUND"
                      message: "Sprite not found: sprite/plant/Unknown"

  /compose:
    get:
      tags:
        - Compose
      summary: What the scene composer takes, and what it refuses
      description: |
        The collection of a `POST`-only route that has something to say about itself: the scene spec
        version, the limits, and how a result is addressed. A client that reaches `/compose`
        without a body is told how to use it rather than served a 404 that reads like the route is
        missing.
      responses:
        '200':
          description: The spec version, the limits and the cache's address
          content:
            application/json:
              schema:
                type: object
                properties:
                  spec:
                    type: integer
                    example: 1
                  method:
                    type: string
                    example: "POST"
                  body:
                    type: string
                  formats:
                    type: array
                    items:
                      type: string
                  layout:
                    type: string
                    example: "?format=layout"
                  itemKinds:
                    type: array
                    items:
                      type: string
                  limits:
                    $ref: '#/components/schemas/ComposeLimits'
                  cache:
                    type: object
                  result:
                    type: string
                    example: "/compose/9f2c1d1b2a3c4d5e6f708192a3b4c5d6e7f80912.png"
    post:
      tags:
        - Compose
      summary: Compose a scene from a spec, and answer one picture plus its layout
      description: |
        A **scene** in, one picture and the layout of what is in it out.

        The spec names things the way the game does and **never in pixels**: a species, a tile column
        and row, a mutation by name, a crop's own `size` on the game's 50-to-100 band. The API owns
        the math — the reference tile, the slot offsets, the tile scale, the pot anchors, the size
        curve, the rotation and the z-order ladder — so a caller does not have to reproduce a curve
        the game owns.

        **The layout comes from `@mg.js/art`.** The recipes and the frames are that package's; this
        endpoint adds a rasteriser, a cache and a host, and re-implements none of the placement
        math. A browser consumer running the same package against a canvas gets the same boxes.

        **A crop is drawn where and when it is.** Its `size` is the game's 50-to-100 band and its
        growth is the game's own curve over the window it states (`startTime` to `endTime`, with
        `remainingMs` saying where in it the picture is): a multi-harvest crop grows from nothing and
        is 0.7 of the way up by the time its window ends, while a single-harvest crop is the plant
        itself and starts at a fifth of its size. A crop that states no window, or one with no moment
        in it, is drawn ripe — which is what every spec did before the window was read.

        **Where a crop stands is the game's own rule, and it is not a spread.** A multi-harvest
        plant's crop goes at the place its blueprint states for that slot — `slotOffsets[slot]`,
        measured from the middle of the plant's own art, turned by the slot's angle and, for a
        species whose table sets `rotateSlotOffsetsRandomly`, by `35 − startTime % 70` degrees. Such
        a crop is also drawn with its species' `plantTransform` pivot, which is what keeps a size-100
        fruit attached at the same point of its own art as a size-50 one. A single-harvest plant
        states no places at all: its sprigs stand where the spec puts them, or where the game's own
        scatter lays a cluster out when the spec states none. Tiles are painted in the game's world
        order — a thing lower on the screen is drawn in front — whatever order the spec listed them
        in; `layout.items` stays in the normalised (id) order so a caller has both.

        **Each item's box is the tight union of what that item actually draws** — its art plus the
        mutation layers that reach past it — which is this API's convention
        (`src/assets/sprites/cropBox.js` states it for the single-picture path). It is deliberately
        **not** `@mg.js/art`'s own species-wide box, which reserves room for every mutation the
        tables state, worn or not: the two differ by design and a consumer must not expect them to
        match.

        **Cached by content.** The key is the SHA-256 of the normalised spec, so item order and
        whitespace do not change it, and two requests for the same scene compose once. The answer is
        served back as `GET /compose/<key>.png`, so a client or a CDN can link it without posting
        the spec again. The cache is capped and evicts least-recently-used.

        **A spec over a limit is refused, not truncated** — truncating a scene would silently return
        a wrong picture, which is the one failure this design exists to prevent. The limits are
        declared in `x-mg-contract.compose` and re-served by `/schema.json`, so a client can check
        before it sends.

        **Caching:** `public, max-age=86400, stale-while-revalidate=3600` on the POST; the
        content-addressed `GET` is `immutable` for a year.
      parameters:
        - name: format
          in: query
          required: false
          description: |
            `layout` (case-insensitive) answers the same boxes as a JSON body and encodes no image
            at all — the form that can be asserted as numbers without decoding a PNG. Omitted, the
            answer is the picture. Any other value is a `400`.
          schema:
            type: string
            enum: ["layout"]
          example: "layout"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComposeSpec'
            examples:
              twoPlantsAndABareCrop:
                summary: Two plants and a bare crop
                value:
                  spec: 2
                  canvas:
                    fit: content
                    padding: 0
                  items:
                    - id: clover
                      kind: plant
                      species: Clover
                      at:
                        column: 0
                        row: 0
                      crops:
                        - slot: 0
                          size: 88
                          mutations: ["Wet"]
                    - id: cactus
                      kind: plant
                      species: Cactus
                      at:
                        column: 1
                        row: 0
                    - id: bare
                      kind: crop
                      species: Clover
                      at:
                        column: 0
                        row: 1
                      size: 71
                      mutations: ["Wet"]
              tiledGround:
                summary: A ground of the game's own tile art
                value:
                  spec: 2
                  canvas:
                    fit: content
                    padding: 16
                  background:
                    kind: tiles
                    ground: Dirt_A
                    columns: 6
                    rows: 4
                  items:
                    - id: a
                      kind: crop
                      species: Clover
                      size: 71
      responses:
        '200':
          description: The composed picture, or the layout as JSON with `format=layout`
          headers:
            X-MG-Compose-Key:
              $ref: '#/components/headers/ComposeKey'
            X-MG-Game-Version:
              $ref: '#/components/headers/GameVersion'
          content:
            image/png:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/SceneLayout'
              examples:
                layout:
                  summary: The same boxes the picture was drawn into
                  value:
                    spec: 2
                    key: "9f2c1d1b2a3c4d5e6f708192a3b4c5d6e7f80912"
                    canvas:
                      width: 792
                      height: 1786
                      origin:
                        x: 321
                        y: 1219
                      grid:
                        step: 256
                        columns: null
                        rows: null
                      fit: content
                      padding: 0
                    items:
                      - id: bare
                        kind: crop
                        species: Clover
                        box:
                          x: 296
                          y: 1475
                          width: 258
                          height: 311
                        scene:
                          x: -24
                          y: 256
                          width: 258
                          height: 311
                        z: 2
                        sprites: ["sprite/plant/CloverThreeLeaf", "sprite/mutation/Wet"]
                        crops: []
                    background: null
        '400':
          description: |
            The spec is malformed, over a declared limit, or names a spec version this instance does
            not implement. The code names which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                versionUnsupported:
                  summary: A spec version this instance does not implement
                  value:
                    error:
                      code: "COMPOSE_SPEC_VERSION_UNSUPPORTED"
                      message: "spec 7 is not supported; this instance implements spec 2, 1"
                      limit: 2
                      saw: 7
                overTheItemCount:
                  summary: More items than the declared maximum
                  value:
                    error:
                      code: "COMPOSE_LIMIT_EXCEEDED"
                      message: "items: 257 items is over the limit of 256"
                      limit: "maxItems"
                      saw: 257

  /compose/{key}.png:
    get:
      tags:
        - Compose
      summary: Serve a composed scene straight from the cache
      description: |
        The content-addressed result: `X-MG-Compose-Key` from a `POST /compose` is the key, and the
        answer is the same PNG that request returned. A key the cache does not hold is a `404` that
        says so — the scene cannot be reconstructed from a hash, so a miss is a real miss rather than
        a cold compose. Immutable, because the key is the content.
      parameters:
        - name: key
          in: path
          required: true
          description: The 40-hex content key a `POST /compose` answered
          schema:
            type: string
          example: "9f2c1d1b2a3c4d5e6f708192a3b4c5d6e7f80912"
      responses:
        '200':
          description: The composed PNG
          headers:
            X-MG-Compose-Key:
              $ref: '#/components/headers/ComposeKey'
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: The path is not a content key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No composed scene is cached under that key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


