  /assets/proxy:
    get:
      tags:
        - Assets
      summary: Fetch an upstream asset through this host, with CORS
      description: |
        Streams a whitelisted upstream asset — a `https://magicgarden.gg/…` URL, or
        a `/assets/sprites/…` URL of the upstream fork's sprite host — back to the
        caller with `Access-Control-Allow-Origin: *`. Upstream sets no such header,
        so a browser cannot read those pixels directly; this proxy is the path that
        makes them readable cross-origin.

        **Not a general open proxy:** a URL outside the whitelist is rejected with
        `BAD_REQUEST` and never fetched. The response is cached
        `public, max-age=86400, immutable`, because the URL names a versioned asset.
        An upstream that accepts the connection but never answers becomes a named
        `504 UPSTREAM_TIMEOUT` instead of an open socket.
      parameters:
        - name: url
          in: query
          required: true
          description: Absolute upstream URL to fetch. Only whitelisted hosts are accepted.
          schema:
            type: string
            format: uri
      responses:
        '200':
          description: The upstream body, with the upstream `Content-Type`
          content:
            image/png:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Missing `url`, or a URL outside the whitelist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Upstream answered a non-2xx status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Upstream did not respond within the platform timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /assets/sprite-data:
    get:
      tags:
        - Assets
      summary: Get sprites data
      description: |
        Returns sprite atlas metadata with powerful filtering options.

        **Query parameters:**
        - `search`: Filter sprites by name (case-insensitive partial match)
        - `cat`: Filter by category (seeds, plants, pets, etc.)
        - `full=1`: Include detailed sprite information (anchors, frames, source sizes)
        - `flat=1`: Return flat array instead of grouped by category

        **Use cases:**
        - Find sprite URLs for specific items
        - Browse available sprites by category
        - Get sprite dimensions and atlas coordinates
        - Build sprite catalogs

        **Response notes:**
        - `baseUrl` points to the game's versioned asset base, not the API host.
        - `url` points to the atlas PNG; use `/assets/sprites` for individual sprite PNGs.

        **Examples:**
        - `/assets/sprite-data?search=Carrot` - Find all Carrot sprites
        - `/assets/sprite-data?cat=seeds` - Get all seed sprites
        - `/assets/sprite-data?search=Bunny&full=1` - Get detailed Bunny sprite info
        - `/assets/sprite-data?cat=pets&flat=1` - Flat list of pet sprites
      parameters:
        - name: full
          in: query
          description: Include full sprite information (anchors, source sizes)
          schema:
            type: string
            enum: ['1']
          example: '1'
        - name: search
          in: query
          description: Filter sprites by ID (partial match, case-insensitive)
          schema:
            type: string
          example: 'Carrot'
        - name: cat
          in: query
          description: Filter by category
          schema:
            type: string
            enum: ["seeds", "plants", "tallPlants", "mutations", "pets", "pet-cosmetic", "decor", "items", "objects", "ui", "animations", "weather", "tiles", "winter"]
          example: 'seeds'
        - name: flat
          in: query
          description: Return flat list instead of grouped by category
          schema:
            type: string
            enum: ['1']
          example: '1'
      responses:
        '200':
          description: Sprites data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpritesResponse'
              examples:
                grouped:
                  summary: Grouped response (default)
                  value:
                    baseUrl: "https://magicgarden.gg/version/<version>/assets/"
                    count: 3
                    categories:
                      - cat: "seeds"
                        items:
                          - id: "Carrot"
                            url: "https://magicgarden.gg/version/<version>/assets/sprites-0.png"
                          - id: "Cabbage"
                            url: "https://magicgarden.gg/version/<version>/assets/sprites-0.png"
                      - cat: "plants"
                        items:
                          - id: "Carrot"
                            url: "https://magicgarden.gg/version/<version>/assets/sprites-0.png"
                flat:
                  summary: Flat response (with flat=1)
                  value:
                    baseUrl: "https://magicgarden.gg/version/<version>/assets/"
                    count: 3
                    items:
                      - id: "Carrot"
                        cat: "seeds"
                        url: "https://magicgarden.gg/version/<version>/assets/sprites-0.png"
                      - id: "Cabbage"
                        cat: "seeds"
                        url: "https://magicgarden.gg/version/<version>/assets/sprites-0.png"
                      - id: "Carrot"
                        cat: "plants"
                        url: "https://magicgarden.gg/version/<version>/assets/sprites-0.png"
                fullDetails:
                  summary: Full details (with full=1)
                  value:
                    baseUrl: "https://magicgarden.gg/version/<version>/assets/"
                    count: 1
                    categories:
                      - cat: "seeds"
                        items:
                          - id: "Carrot"
                            url: "https://magicgarden.gg/version/<version>/assets/sprites-0.png"
                            frame:
                              x: 0
                              y: 0
                              w: 64
                              h: 64
                            anchor:
                              x: 0.5
                              y: 0.5
                            sourceSize:
                              w: 64
                              h: 64

