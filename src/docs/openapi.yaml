  /data/abilities:
    get:
      tags:
        - Data
      summary: Get abilities data
      description: |
        Returns all pet special abilities.

        Each ability includes:
        - `name`: display name
        - `trigger`: when the ability fires (`continuous`, `hatchEgg`,
          `sellAllCrops`, `weather`, ...)
        - `baseProbability`: chance in percent (absent on always-on triggers)
        - `baseParameters`: the effect's own parameters, shape depends on the ability
        - `color`: the flat colour used by the game's UI. Abilities the game
          gives no dedicated colour to — newer tier III variants, for
          instance — fall back to the game's own default, `#969696`.
        - `gradient`: only on multicolour abilities (GoldGranter,
          RainbowGranter). Carries the full ramp — `angleDegrees` plus ordered
          `colorStops` of `{color, offset}`, `offset` in `0..1`.
        - `description` / `descriptionTokens`: the in-game tooltip sentence.

        **Descriptions**

        `description` is the tooltip text the game shows, in English, and is
        `null` when the game ships none. It may contain positional placeholders
        `<0/>`, `<1/>`, ... which the game renders as icons. `descriptionTokens`
        gives what each placeholder stands for, in the same order:

        | `type` | `id` refers to |
        |---|---|
        | `mutation` | a `/data/mutations` entry |
        | `item` | a `/data/items` entry |
        | `crop` | a `/data/plants` entry |
        | `currency` | a value of the `currency` enum |
        | `rarity` | a value of the `rarity` enum |
        | `unknown` | unresolved (`id` is `null`) |

        Substitute each placeholder with the token's icon, or with its `id` for
        a plain-text rendering. Numeric values (probability, cooldown) are not
        part of the sentence — they come from `baseProbability` /
        `baseParameters`.

        **Use cases:**
        - Build pet ability guides
        - Compare pet effectiveness
        - Display ability catalogs
        - Help players choose pets
      responses:
        '200':
          description: Abilities data
          headers:
            X-Game-Version:
              $ref: '#/components/headers/GameVersion'
          content:
            application/json:
              schema:
                type: object
                properties:
                  _meta:
                    $ref: '#/components/schemas/ResponseMeta'
                additionalProperties:
                  type: object
              examples:
                abilityData:
                  summary: Example abilities
                  value:
                    CoinFinderI:
                      name: "Coin Finder I"
                      trigger: "continuous"
                      baseProbability: 35
                      baseParameters:
                        baseMaxCoinsFindable: 120000
                      color: "#B49600"
                      description: "Chance to find <0/> coins"
                      descriptionTokens:
                        - type: "currency"
                          id: "Coins"
                    GoldGranter:
                      name: "Gold Granter"
                      trigger: "continuous"
                      baseProbability: 0.72
                      baseParameters:
                        grantedMutations:
                          - "Gold"
                      color: "#DCC846"
                      gradient:
                        angleDegrees: 135
                        colorStops:
                          - color: "#DCC846"
                            offset: 0
                          - color: "#D2AF05"
                            offset: 0.4
                          - color: "#D2B937"
                            offset: 0.7
                          - color: "#C8AF1E"
                            offset: 1
                      description: "Chance to grant <0/> mutation to a garden crop"
                      descriptionTokens:
                        - type: "mutation"
                          id: "Gold"
                    PlantGrowthBoostIII:
                      name: "Plant Growth Boost III"
                      trigger: "continuous"
                      baseProbability: 30
                      baseParameters:
                        plantGrowthReductionMinutes: 7
                      color: "#969696"
                      description: "Chance to reduce growth time of garden plants"
                      descriptionTokens: []

