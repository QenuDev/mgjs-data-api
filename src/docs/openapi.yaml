openapi: 3.0.3
info:
  title: Magic Garden API
  # Version du *contrat*, pas du serveur ni du jeu. Un client la compare à celle
  # qu'il sait lire avant de faire confiance à une URL. Chaîne parce que
  # l'OpenAPI 3.0 l'exige ; /schema.json et /data/version la servent en nombre.
  version: "1"
  description: |
    **Unofficial API** for Magic Garden game data that dynamically extracts and provides game content.

    ## Overview

    This API provides two types of data:
    - **Static data**: Extracted from the game's minified bundle (plants, pets, items, etc.)
    - **Live data**: Shops and weather, tracked from the game's official platform API

    ## Quick Start

    The examples below are relative on purpose. This document describes the instance
    that served it, and the base URL is the first entry of `servers` -- a fork is
    deployed under its own name, so an example that named one deployment would send
    every reader to that one.

    ### Get All Game Data
    ```bash
    curl "$API/data"
    ```

    ### Get Specific Plant
    ```bash
    curl "$API/data/plants" | jq '.Carrot'
    ```

    ### Stream Live Updates
    ```javascript
    const eventSource = new EventSource(`${API}/live/stream`);
    eventSource.addEventListener('weather', (event) => {
      const data = JSON.parse(event.data);
      console.log('Weather:', data.weather);
    });
    eventSource.addEventListener('shops', (event) => {
      const shops = JSON.parse(event.data);
      console.log('Seed shop:', shops.seed);
    });
    ```

    ## Key Features

    - **Auto-updating**: Data automatically refreshes from the game bundle
    - **Live shops & weather**: Tracked from the game's official platform API, with
      restock dates announced by the game itself
    - **Sprites included**: All data includes sprite URLs ready to use
    - **Server-Sent Events**: Real-time streaming via SSE
    - **Smart caching**: Optimized performance with automatic cache invalidation
    - **Searchable**: Filter and search sprites by category and name

    ## Data Structure

    All static game data follows this pattern:
    - **Keyed by ID**: Objects are keyed by their game ID (e.g., `"Carrot"`, `"Bunny"`)
    - **Sprite URLs**: All entities include absolute sprite URLs
    - **Complete info**: Full lifecycle data (for plants: seed → plant → crop)

    ## Rate Limiting

    - Default: 100 requests per minute per IP
    - Configurable via environment variables
    - SSE streams use a separate limiter (defaults to RATE_LIMIT_MAX / 10 per window)

    ## CORS

    CORS is enabled by default for all origins. Configure via environment variables if needed.

    ## Need Help?

    - **Issues**: Report bugs or request features on GitHub
    - **Documentation**: Full OpenAPI spec available at `/docs/openapi.json`
    - **Examples**: See endpoint descriptions for detailed usage examples
  contact:
    name: Ariedam
  license:
    name: ISC

# Le contrat lui-même, lisible par un client sans analyser les chemins :
# quelles parties de l'API existent ici, quelles catégories de données le bundle
# courant permet de construire, et de quelle version du jeu elles viennent.
# Servi tel quel par /docs/openapi.json, et sous forme plate par /schema.json.
x-mg-contract:
  api: 1
  capabilities:
    - data
    - sprites
    - sprites.composed
    - sprites.data
    - live.weather
    - live.shops
    - animations
    - rive
    - compose
  data:
    - plants
    - pets
    - items
    - decors
    - eggs
    - abilities
    - mutations
    - weathers
    - weather-groups
    - enums
    - version
    - art
  # La scène que `POST /compose` accepte : la version du *format* de spec, et les limites au-delà
  # desquelles une spec est refusée par une erreur nommée plutôt que tronquée. Ce sont les mêmes
  # nombres que `COMPOSE_LIMITS` (`src/assets/compose/spec.js`), et `tests/compose-spec.test.js`
  # lit les deux et les compare : une limite qui bouge dans le code et pas ici refuserait un client
  # que le contrat lui a dit acceptable.
  compose:
    spec: 2
    maxItems: 256
    maxCanvas: "4096x4096"
    maxPixels: 16777216
  # Remplis à chaque réponse depuis l'instance qui sert : `null` dans ce fichier
  # veut dire « pas encore construit » (aucune synchronisation sur cet hôte).
  gameVersion: null
  artVersion: null
  generatedAt: null

# Pas de bloc `servers` ici, volontairement : il est construit à chaque réponse
# par `buildServers()` (`src/docs/contract.js`) depuis `API_PUBLIC_URL` et le
# port que ce serveur écoute vraiment. Un fork se déploie sous son propre nom,
# et un document qui nommerait l'hôte d'un déploiement en particulier enverrait
# ses lecteurs ailleurs.

tags:
  - name: Data
    description: |
      Static game data extracted from the game's minified bundle.

      These endpoints provide comprehensive information about game entities including plants, pets, items, decorations, eggs, mutations, and abilities. All data is automatically extracted and stays up-to-date with the game.

      **Refresh rate:** Data is cached for 5 minutes by default.

      **Provenance:** every response carries `X-Game-Version`, the game version its
      body was built from. Every JSON body also states that version, the contract
      version and `generatedAt` together under one reserved `_meta` key — reserved
      because these bodies are the game's data keyed by entity name, so any root
      field could collide with a plant or an item. Should a category ever hold an
      entry named `_meta`, the block retreats to `__meta` rather than overwrite it.
      `/data/version` is the exception: its body **is** that block, so it carries
      the header and no `_meta`.

  - name: Assets
    description: |
      Game assets including sprites, cosmetics, and audio.

      Access sprite metadata, download individual sprite files, browse cosmetics, and get audio information. All sprites are exported as PNG files and URLs are ready to use.

      **Features:**
      - Search and filter sprites
      - Download individual sprite files
      - Get sprite atlas information
      - Access cosmetics and audio data

  - name: Live
    description: |
      Live game data, tracked from the game's official platform API.

      Get current weather and shop inventories. Supports both snapshot endpoints (one-time requests) and SSE streams (pushed on change).

      **Data sources:**
      - Weather: Current in-game weather condition
      - Shops: Inventory, restock date and countdown for every shop the game exposes (see `/data/enums` -> `eligibleShops`)

      **Update methods:**
      - Snapshot: One-time GET request for current state
      - Stream: Server-Sent Events, emitted when a shop or the weather actually changes

      **Freshness:** the upstream API is polled a few times a minute, and on top of
      that right on each `nextRestockAt` the game announces — so a restock or a
      weather change surfaces within seconds of happening. Both the game's
      responses and ours are cached briefly, so treat sub-second precision as
      approximate; `nextRestockAt` itself is exact.

  - name: Stats
    description: |
      Aggregated statistics on shops and weather from persisted history (SQLite).

      The API records every shop restock and weather transition since the recorder was enabled. These endpoints expose aggregated views (drop rates, distributions, time series) suitable for dashboards and charts.

      **Data freshness:**
      - Shop data accumulates as the game restocks each shop (each shop has its own cycle).
      - Weather data accumulates on every weather change.
      - There is no data from before the recorder was first started, so earlier buckets will simply come back empty.

      **Date parameters:**
      - All `from` / `to` parameters accept either epoch milliseconds (e.g. `1778800000000`) or ISO 8601 (e.g. `2026-05-01` or `2026-05-01T12:00:00Z`).
      - Default range when omitted: last 30 days.

      **Bucketing:**
      - Buckets are aligned on UTC boundaries.
      - Allowed values: `hour`, `day`, `week`.
      - Buckets without data are returned with zeros / empty objects (no holes in time series).
      - Hard cap of 10000 buckets per response.

  - name: CSV / TSV Export
    description: |
      Every `/data/*` and `/live/*` endpoint is available as CSV or TSV by appending `.csv` or `.tsv` to the URL.
      Nested fields are flattened with dot notation. Ideal for Excel, Google Sheets (`=IMPORTDATA(...)`), or any spreadsheet tool.

      Each `/data/*` export carries `X-Game-Version` like every other `/data`
      response; the `/live/*` exports carry no version header, because live data is
      polled from the game's platform API rather than built from the bundle. None
      carries `_meta`: the format is a table, so a metadata key would add an empty
      column to every entity and one empty row.

  - name: Health
    description: |
      Health check and monitoring endpoints.

      Monitor API health, readiness, and cache status. Includes Kubernetes-style probes for liveness and readiness checks.

      **Endpoints:**
      - `/health`: Comprehensive health status
      - `/health/ready`: Readiness probe (checks if data is loaded)
      - `/health/live`: Liveness probe (checks if server is running)

  - name: Weather Station
    description: |
      Deterministic weather forecast for Magic Garden, modelled locally.

      The station stitches three sources into one view: recorded history (the
      SQLite recorder) for the past, the live poller for the present, and a
      deterministic replay of the game's own weather scheduler for the future.
      Responses say whether they came from the engine (`modeled`), and where the
      engine and the recorded history disagree the difference is reported rather
      than hidden — that gap is the signal that the game changed its scheduler.

      `tz` selects the civil day used by the day view; `engine` pins a specific
      era of the scheduler instead of the one covering *now*. Ranges are capped
      (see each endpoint), and a window already in the past caches for a day while
      a future one revalidates within minutes.

  - name: Documentation
    description: |
      The API's own documentation surface.

      `/docs` is the interactive explorer, `/docs/openapi.json` is the document
      that drives it. These are the only paths here that exist to describe the
      rest of the API rather than to serve game data, and both are served by this
      deployment.

paths:
  /:
    get:
      summary: API root
      description: |
        Returns API information and core endpoint categories.

        **Use cases:**
        - Discover available endpoints
        - Check API version
        - Get quick navigation links
      responses:
        '200':
          description: API information
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: "MG API"
                  version:
                    type: string
                    example: "2.0.0"
                  description:
                    type: string
                    example: "Unofficial Magic Garden API"
                  endpoints:
                    type: object
                    description: Available endpoint categories
                    properties:
                      data:
                        type: string
                        example: "/data"
                      live:
                        type: string
                        example: "/live"
                      health:
                        type: string
                        example: "/health"
                      docs:
                        type: string
                        example: "/docs"
              examples:
                root:
                  summary: API root response
                  value:
                    name: "MG API"
                    version: "2.0.0"
                    description: "Unofficial Magic Garden API"
                    endpoints:
                      data: "/data"
                      live: "/live"
                      health: "/health"
                      docs: "/docs"

  /schema.json:
    get:
      tags:
        - Health
      summary: The API contract, as this instance serves it now
      description: |
        The contract a client checks before it trusts this host, in plain JSON and
        without authentication: the contract version, the paths this deployment
        serves, the capabilities it declares, the `/data` categories the running
        bundle can actually build, the game version the data and sprites were built
        from, and when.

        This is the same contract `/docs/openapi.json` carries in its
        `x-mg-contract` extension, read from the same `openapi.yaml` — the two
        cannot drift apart. A client that does not find the contract version or a
        capability it needs should refuse the URL rather than parse whatever comes
        back.

        Cached for one minute.
      responses:
        '200':
          description: The contract of the running instance
          content:
            application/json:
              schema:
                type: object
                properties:
                  contract:
                    type: integer
                    description: Contract version, same as `info.version` in this document
                    example: 1
                  api:
                    type: integer
                    example: 1
                  capabilities:
                    type: array
                    items:
                      type: string
                  paths:
                    type: array
                    items:
                      type: string
                  data:
                    type: array
                    items:
                      type: string
                  unavailable:
                    type: object
                    additionalProperties:
                      type: string
                  gameVersion:
                    type: string
                    nullable: true
                  artVersion:
                    type: string
                    nullable: true
                  generatedAt:
                    type: string
                    nullable: true
                  compose:
                    type: object
                    description: The scene spec `POST /compose` accepts, and its limits
                    properties:
                      spec:
                        type: integer
                        example: 1
                      maxItems:
                        type: integer
                        example: 256
                      maxCanvas:
                        type: string
                        example: "4096x4096"
                      maxPixels:
                        type: integer
                        example: 16777216
              examples:
                schema:
                  summary: Contract of the running instance
                  value:
                    contract: 1
                    api: 1
                    capabilities: ["data", "sprites", "sprites.composed", "sprites.data", "live.weather", "live.shops", "animations", "rive", "compose"]
                    paths: ["/", "/health", "/schema.json", "/data", "/data/plants"]
                    data: ["plants", "pets", "items", "decors", "eggs", "abilities", "mutations", "weathers", "weather-groups", "enums"]
                    unavailable: {}
                    gameVersion: "1191"
                    artVersion: "1191"
                    generatedAt: "2026-09-16T05:00:00.000Z"

  /docs:
    get:
      tags:
        - Documentation
      summary: Interactive documentation page
      description: |
        The single-page explorer (HTML) for this API: it lists every path of this
        document and lets a reader call them from the browser. Served with
        `Cache-Control: no-store`, so a deployment never shows a stale explorer
        behind a CDN.
      responses:
        '200':
          description: The explorer page
          content:
            text/html:
              schema:
                type: string

  /docs/openapi.json:
    get:
      tags:
        - Documentation
      summary: This OpenAPI document as JSON
      description: |
        The document the explorer reads: this `openapi.yaml`, plus the facts of
        the instance serving it (`x-mg-contract.gameVersion`, `artVersion`,
        `generatedAt`) and a `servers` list built from this deployment's own
        configuration instead of a hard-coded host. The `shop` parameter enum is
        refreshed from the running instance, so it does not go stale when the game
        adds a shop.

        `Cache-Control: no-store`, and the same source as `/schema.json` — the two
        cannot announce different contract versions.
      responses:
        '200':
          description: The OpenAPI document
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: |
        Returns comprehensive health status of the API server.

        **Includes:**
        - Server status and uptime
        - Bundle cache status
        - Cached data categories

        **Use cases:**
        - Monitoring and alerting
        - Debugging connection issues
        - Checking cache status
        - Verifying API readiness
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              examples:
                healthy:
                  summary: Healthy API
                  value:
                    status: "ok"
                    timestamp: "2024-01-20T10:30:00.000Z"
                    uptime: 3600
                    cache:
                      hasBundleCached: true
                      bundleUrl: "https://magicgarden.gg/version/642/assets/main-D3Z0cIc_.js"
                      bundleFetchedAt: "2024-01-20T10:00:00.000Z"
                      bundleAge: 180000
                      categoriesCached: ["plants", "pets", "items", "decor", "eggs", "mutations", "abilities"]

  /health/ready:
    get:
      tags:
        - Health
      summary: Readiness probe
      description: |
        Kubernetes-style readiness probe to check if the API is ready to serve traffic.

        **Returns 200 when:**
        - Server is running
        - Game bundle is cached

        **Returns 503 when:**
        - Bundle is not yet cached
        - System is starting up

        **Use cases:**
        - Kubernetes readiness probes
        - Load balancer health checks
        - Determine if API can serve requests
        - Wait for startup completion
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready:
                    type: boolean
                    example: true
              examples:
                ready:
                  summary: Service ready
                  value:
                    ready: true
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready:
                    type: boolean
                    example: false
                  reason:
                    type: string
              examples:
                notReady:
                  summary: Service not ready
                  value:
                    ready: false
                    reason: "Bundle not yet cached"

  /health/live:
    get:
      tags:
        - Health
      summary: Liveness probe
      description: |
        Kubernetes-style liveness probe to check if the API is alive.

        **Returns 200 when:**
        - Server process is running
        - API can respond to requests

        **Use cases:**
        - Kubernetes liveness probes
        - Monitor if server needs restart
        - Basic uptime monitoring
        - Detect deadlocks or crashes

        **Note:** This endpoint checks basic aliveness only. Use `/health/ready` to check if the API is ready to serve data.
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  alive:
                    type: boolean
                    example: true
              examples:
                alive:
                  summary: Service alive
                  value:
                    alive: true

  /data/version:
    get:
      tags:
        - Data
      summary: Game version this instance's data was built from
      description: |
        Returns the game version this host's data and sprites were built from, the
        contract version, and when that build last completed.

        `mg.js` already asks for this path; the upstream host answers 404. Both
        `gameVersion` and `artVersion` come from the on-disk build record
        (`data/version.json`, written when a sprite/atlas sync finishes), never
        from a fresh call to the game's `/platform/v1/version`: the point is what
        this host's data **is**, not what the game is right now. A host that has
        never synced reports `null` for both rather than inventing a version.

        These are the same three facts `/schema.json` reports, so a client can
        read either. This body **is** the provenance block, so it carries no `_meta`
        key; like every other `/data` response it carries `X-Game-Version`.

        Cached for one minute.
      responses:
        '200':
          description: Build version of this instance
          headers:
            X-Game-Version:
              $ref: '#/components/headers/GameVersion'
          content:
            application/json:
              schema:
                type: object
                properties:
                  gameVersion:
                    type: string
                    nullable: true
                  artVersion:
                    type: string
                    nullable: true
                  contract:
                    type: integer
                    example: 1
                  generatedAt:
                    type: string
                    nullable: true
              examples:
                built:
                  summary: A host that has synced
                  value:
                    gameVersion: "1191"
                    artVersion: "1191"
                    contract: 1
                    generatedAt: "2026-09-16T05:00:00.000Z"

  /data:
    get:
      tags:
        - Data
      summary: Get all game data
      description: |
        Returns all game data extracted from the game bundle.

        This endpoint provides a comprehensive snapshot of all available game content including:
        - Plants (seeds, plants, and crops with growth information)
        - Pets (companions with abilities and stats)
        - Items (tools, consumables)
        - Decorations (garden decorations)
        - Eggs (pet eggs with hatch requirements)
        - Mutations (special plant variations)
        - Abilities (special pet abilities)
        - Weathers (weather definitions and icons)
        - Weather groups (scheduling engine: duration, timing, drop odds)
        - Enums (canonical rarity, currency, item type, shop lists)

        **Note:** All sprite URLs are absolute and ready to use.

        **Provenance:** the body carries `X-Game-Version` and the reserved `_meta`
        key (`gameVersion`, `contract`, `generatedAt`) described below.

        **Partial responses:** a game update can move the data out from under one of
        the extractors. When that happens the affected key is simply **absent** from
        this response rather than the whole endpoint failing, so read defensively
        (`data.pets?.…`) instead of assuming every key is present. `/health` lists
        any currently unavailable category under `data.unavailable`, and the
        per-category endpoint (e.g. `/data/pets`) still returns the error.
      responses:
        '200':
          description: All game data
          headers:
            X-Game-Version:
              $ref: '#/components/headers/GameVersion'
          content:
            application/json:
              schema:
                type: object
                properties:
                  _meta:
                    $ref: '#/components/schemas/ResponseMeta'
                  plants:
                    type: object
                    description: All plants data (keyed by plant ID)
                  pets:
                    type: object
                    description: All pets data (keyed by pet ID)
                  items:
                    type: object
                    description: All items data (keyed by item ID)
                  decor:
                    type: object
                    description: All decorations data (keyed by decor ID)
                  eggs:
                    type: object
                    description: All eggs data (keyed by egg ID)
                  mutations:
                    type: object
                    description: All mutations data (keyed by mutation ID)
                  abilities:
                    type: object
                    description: All abilities data (keyed by ability ID)
                  weathers:
                    type: object
                    description: All weathers data (keyed by weather ID)
                  weatherGroups:
                    type: object
                    description: >-
                      Weather scheduling rules (keyed by group ID). Modelled, not
                      extracted — see `/data/weather-groups`.
                  enums:
                    type: object
                    description: Canonical game enums (rarity, currency, item type, shops)
              examples:
                complete:
                  summary: Complete data response
                  value:
                    plants:
                      Carrot:
                        seed:
                          name: "Carrot Seed"
                          coinPrice: 10
                          sprite: "/assets/sprites/seeds/Carrot.png"
                        plant:
                          name: "Carrot Plant"
                          harvestType: "Single"
                          sprite: "/assets/sprites/plants/BabyCarrot.png"
                        crop:
                          name: "Carrot"
                          baseSellPrice: 20
                          sprite: "/assets/sprites/plants/Carrot.png"
                    pets:
                      Bunny:
                        name: "Bunny"
                        coinPrice: 500
                        ability: "HarvestBoost"
                        sprite: "/assets/sprites/pets/Bunny.png"
                    items:
                      WateringCan:
                        name: "Watering Can"
                        type: "tool"
                        coinPrice: 100
                        sprite: "/assets/sprites/items/WateringCan.png"
                    mutations: {}
                    eggs: {}
                    decor: {}
                    abilities: {}
                    weathers: {}
                    weatherGroups: {}

  /data.csv:
    get:
      tags:
        - CSV / TSV Export
      summary: Comma-separated export of every `/data` category
      description: |
        `/data` as one table: one row per entity, with a `category` column naming
        where the row came from and the entity key in `id`. Nested fields are
        flattened with dot notation, arrays stay JSON strings inside a cell, and
        the columns are the union of every row's fields.

        A category the running bundle cannot build is omitted, exactly as in the
        JSON aggregate — a broken category removes rows, not the file. `plants`
        rows carry `purchasable`, computed from the shops like the JSON route.

        Carries `X-Game-Version` and no `_meta`: a metadata key would add an empty
        column to every row and one row with no data.
      responses:
        '200':
          description: CSV file
          headers:
            X-Game-Version:
              $ref: '#/components/headers/GameVersion'
          content:
            text/csv:
              schema:
                type: string

  /data.tsv:
    get:
      tags:
        - CSV / TSV Export
      summary: Tab-separated export of every `/data` category
      description: |
        The same table as `/data.csv`, with tabs as the delimiter: one row per
        entity, `category` and `id` columns, nested fields flattened with dot
        notation. Carries `X-Game-Version` and no `_meta`.
      responses:
        '200':
          description: TSV file
          headers:
            X-Game-Version:
              $ref: '#/components/headers/GameVersion'
          content:
            text/tab-separated-values:
              schema:
                type: string

  /data/plants:
    get:
      tags:
        - Data
      summary: Get plants data
      description: |
        Returns all plants with complete lifecycle information (seed → plant → crop).

        Each plant entry includes:
        - **Seed**: Name, price, sprite URL
        - **Plant**: Growth stage information, harvest type, sprite URL
        - **Crop**: Harvested item, sell price, sprite URL

        **Use cases:**
        - Display shop inventory
        - Calculate profit margins
        - Build farming guides
        - Generate plant catalogs
      responses:
        '200':
          description: Plants data
          headers:
            X-Game-Version:
              $ref: '#/components/headers/GameVersion'
          content:
            application/json:
              schema:
                type: object
                properties:
                  _meta:
                    $ref: '#/components/schemas/ResponseMeta'
                additionalProperties:
                  $ref: '#/components/schemas/PlantData'
              examples:
                plantData:
                  summary: Example plant data
                  value:
                    Carrot:
                      seed:
                        name: "Carrot Seed"
                        coinPrice: 10
                        sprite: "/assets/sprites/seeds/Carrot.png"
                      plant:
                        name: "Carrot Plant"
                        harvestType: "Single"
                        sprite: "/assets/sprites/plants/BabyCarrot.png"
                      crop:
                        name: "Carrot"
                        baseSellPrice: 20
                        sprite: "/assets/sprites/plants/Carrot.png"
                    Cabbage:
                      seed:
                        name: "Cabbage Seed"
                        coinPrice: 30
                        sprite: "/assets/sprites/seeds/Cabbage.png"
                      plant:
                        name: "Cabbage Plant"
                        harvestType: "Multiple"
                        sprite: "/assets/sprites/plants/CabbagePlant.png"
                      crop:
                        name: "Cabbage"
                        baseSellPrice: 42
                        sprite: "/assets/sprites/plants/Cabbage.png"
        '500':
          $ref: '#/components/responses/InternalError'

  /data/pets:
    get:
      tags:
        - Data
      summary: Get pets data
