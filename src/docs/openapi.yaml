    Shop:
      type: object
      description: Individual shop inventory data
      properties:
        open:
          type: boolean
          description: |
            Whether the shop is currently open. Event shops (`dawn`, `snow`,
            `thunder`, `apology`) are closed outside their event, with no
            `nextRestockAt` and an empty inventory.
          example: true
        nextRestockAt:
          type: string
          nullable: true
          format: date-time
          description: |
            Exact date of the next restock, as announced by the game, or `null`
            on a closed shop. Restocks land on the game's 5-minute grid.
          example: "2026-08-07T16:00:00.000Z"
        secondsUntilRestock:
          type: integer
          description: |
            Time remaining until the shop restocks (in seconds), derived from
            `nextRestockAt` at request time. `0` on a closed shop.
          example: 188
        items:
          type: array
          description: Inventory of the current restock window
          items:
            type: object
            properties:
              name:
                type: string
                description: Item identifier (matches data endpoints)
                example: "Carrot"
              displayName:
                type: string
                description: Human-readable name, as shown in game
                example: "Carrot Seed"
              itemType:
                type: string
                nullable: true
                description: |
                  Item family (`Seed`, `Egg`, `Tool`, `Decor`, ...). Shops can mix
                  types: the `tool` shop also sells decor, and event shops sell
                  seeds, eggs, potions and decor side by side.
                example: "Seed"
              stock:
                type: integer
                description: |
                  Stock offered by this restock window. This is the window's
                  initial stock, not a live counter: it does not decrease as
                  players buy.
                example: 9
      example:
        open: true
        nextRestockAt: "2026-08-07T16:00:00.000Z"
        secondsUntilRestock: 188
        items:
          - name: "Carrot"
            displayName: "Carrot Seed"
            itemType: "Seed"
            stock: 9
          - name: "Cabbage"
            displayName: "Cabbage Seed"
            itemType: "Seed"
            stock: 2

    SpritesResponse:
