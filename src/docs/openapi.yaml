    Error:
      type: object
      description: Standard error response format
      properties:
        error:
          type: object
          description: Error details
          properties:
            code:
              type: string
              description: Machine-readable error code
              example: "SPRITE_NOT_FOUND"
            message:
              type: string
              description: Human-readable error message
              example: "The requested sprite was not found"
            details:
              type: object
              description: Additional error context (varies by error type)
              additionalProperties: true
              example:
                category: "seeds"
                filename: "NonExistent.png"
      example:
        error:
          code: "SPRITE_NOT_FOUND"
          message: "The requested sprite was not found"
          details:
            category: "seeds"
            filename: "NonExistent.png"

    # Le bloc de provenance des corps de `/data/*`. La clé est réservée : les
    # corps sont les données du jeu keyées par nom, et un nom peut être
    # n'importe quoi. Si une catégorie porte déjà `_meta`, le bloc recule
    # (`__meta`) plutôt que d'écraser une entité.
    ResponseMeta:
      type: object
      description: |
        Provenance of a `/data/*` body: the game version it was built from, the
        contract version it respects, and when the build completed. The same three
        facts `/data/version` publishes, and the same version the `?v=` of the
        sprite URLs inside the body carries.

        A reserved key, not an ordinary one. These bodies are the game's data keyed by
        entity name, so any name is possible: a plant called `gameVersion`, an item
        called `contract`. Three fields at the root would be three ways to overwrite
        an entity, so the facts travel together under one underscore-prefixed key,
        which the game identifiers do not use. If a category ever holds an entry
        literally named `_meta`, the block retreats to `__meta` (and deeper if
        needed) rather than overwrite it, and the collision is logged.
      required:
        - gameVersion
        - contract
        - generatedAt
      properties:
        gameVersion:
          type: string
          nullable: true
          description: |
            Game version this body was built from: the same value as the
            `X-Game-Version` response header and as the `?v=` of the sprite URLs
            inside the body. `null` on a host that has neither a bundle in cache
            nor a build record — where the header is absent rather than empty.
          example: "1191"
        contract:
          type: integer
          description: "Contract version this body respects (this document's `info.version`)"
          example: 1
        generatedAt:
          type: string
          nullable: true
          description: When the build that produced this body completed (ISO 8601), `null` if unknown
          example: "2026-09-16T05:00:00.000Z"

    SpriteBox:
      type: object
      description: |
        The crop art's own rectangle inside the composed picture, in picture pixels. `x`
        and `y` are the corner the art sits at — `0,0` only when no mutation layer reaches
        past the art — and `width`/`height` are the art's own dimensions, so a caller places
        the picture on a tile with the art where it belongs. The picture itself is the tight
        union of the art and its layers, so it is at least that big and usually bigger.

        The same fact as `X-MG-Sprite-Box` and as the `?format=layout` body, which
        carries it under this shape.
      required:
        - x
        - y
        - width
        - height
      properties:
        x:
          type: integer
          description: Left edge of the crop art inside the picture
          example: 0
        y:
          type: integer
          description: Top edge of the crop art inside the picture
          example: 50
        width:
          type: integer
          description: The crop art's own width in pixels
          example: 191
        height:
          type: integer
          description: The crop art's own height in pixels
          example: 238

    SpriteLayout:
      type: object
      description: |
        The `?format=layout` body: the box `X-MG-Sprite-Box` states, as JSON. A
        cross-origin page cannot read the header — it is not in
        `Access-Control-Expose-Headers` — so this is the form it asks for instead.
        One fact, two representations; a caller that holds no picture wants this one.
      required:
        - key
        - mutations
        - box
      properties:
        key:
          type: string
          description: Atlas key of the base sprite, as requested
          example: "sprite/plant/Carrot"
        mutations:
          type: array
          description: Mutation ids applied, deduplicated and in the order the server sorted them
          items:
            type: string
          example: ["Gold"]
        box:
          $ref: '#/components/schemas/SpriteBox'

  responses:
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  # Un seul en-tête, référencé par chaque chemin de `/data` sous son nom réel
  # (`GAME_VERSION_HEADER` dans `src/api/routes/data.js`).
  headers:
    ComposeKey:
      description: |
        The content key of the composed scene: the SHA-256 of the **normalised** spec, first 40 hex
        characters. Two specs that ask for the same picture have the same key, which is what makes
        the cache a hit and what `GET /compose/<key>.png` is addressed by. Item order and whitespace
        do not change it.
      schema:
        type: string
        example: "9f2c1d1b2a3c4d5e6f708192a3b4c5d6e7f80912"

    GameVersion:
      description: |
        Game version the body was built from: the same version as the `?v=` of the
        sprite URLs inside it, as the provenance block's `gameVersion`, and as the
        version the ETag is derived from. Sent on every `/data` response, `304 Not
        Modified` included, so a client or a caching proxy learns which version it
        holds without parsing a body or reading a URL.

        A host that has neither a bundle in cache nor a build record has no honest
        version to announce: the header is **absent** rather than empty.
      schema:
        type: string
        example: "1191"

    SpriteBox:
      description: |
        The crop art's own rectangle inside the composed picture:
        `x,y,width,height` in picture pixels, one parseable value, no PNG decoding. The
        picture is the tight union of the art and its layers, so this rectangle is what
        says where the art landed in it.

        Sent on both representations — the picture and the `?format=layout` body. Not
        sent on `304`, which states no box. Deliberately **not** in the CORS
        `Access-Control-Expose-Headers` list: a cross-origin page cannot read it, and
        does not need to, because `?format=layout` answers the same box in a JSON body
        it can read.
      schema:
        type: string
        example: "0,50,191,238"
