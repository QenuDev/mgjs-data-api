  /live/weather:
    get:
      tags:
        - Live
      summary: Get current weather
      description: |
        Returns the current in-game weather.

        **Weather types:**
        - `Clear Skies` — no weather event running (the game's default state)
        - `Rain`, `Snow`, `Thunderstorm` — the `Hydro` family, one event every 40-60 min
        - `Dawn`, `Amber Moon` — the `Lunar` family, on fixed slots every 4 h

        Every event lasts 10 minutes and starts on the game's 5-minute grid. See
        `/data/weathers` for their effects and `/data/weather-groups` for the
        scheduling engine and drop odds.

        **Note:** This is a snapshot. For real-time updates, use `/live/stream` (combined) or `/live/weather/stream`.
      responses:
        '200':
          description: Current weather
          content:
            application/json:
              schema:
                type: object
                properties:
                  weather:
                    type: string
                    description: Current weather condition
                    example: "Clear Skies"
              examples:
                clearSkies:
                  summary: No weather event running
                  value:
                    weather: "Clear Skies"
                rain:
                  summary: Rain event running
                  value:
                    weather: "Rain"

  /live/shops:
    get:
      tags:
        - Live
      summary: Get shop inventory
      description: |
        Returns current shop inventory and restock timers for all shops.

        **Available shops:**
        - **seed**: Seed shop (plants) — restocks every 5 min
        - **tool**: Tool shop (equipment, plus some decor) — every 10 min
        - **egg**: Egg shop (pets) — every 15 min
        - **decor**: Decoration shop (cosmetics) — every hour
        - **rain**, **dawn**, **amber**, **snow**, **thunder**: event shops, open only during the matching weather
        - **apology**: occasional compensation shop, opened by the game's operators

        Each shop includes:
        - Its inventory, with the stock offered by the current restock window
        - `nextRestockAt`: the exact restock date announced by the game
        - `secondsUntilRestock`: the same thing as a countdown, computed at request time
        - `open`: `false` on an event shop outside its event (empty inventory, no restock date)

        **Use cases:**
        - Track shop rotations
        - Alert when specific items are in stock
        - Calculate restock schedules
        - Build shop tracking bots

        **Note:** This is a snapshot. For real-time updates, use `/live/stream` (combined) or `/live/shops/stream`.
      responses:
