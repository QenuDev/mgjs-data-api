server {
    listen 80;
    server_name mg-api.ariedam.fr;
    return 301 https://mg-api.ariedam.fr$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mg-api.ariedam.fr;

    ssl_certificate /etc/letsencrypt/live/mg-api.ariedam.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mg-api.ariedam.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Performance
    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/plain
        text/css
        text/xml
        image/svg+xml;

    # Composed sprites are dynamic: `GET /assets/sprites/composed?key=...` runs
    # `composeSprite()` and answers with its own ETag and
    # `Cross-Origin-Resource-Policy` (`src/api/routes/composed.js:37-49`), so it
    # must reach Express.
    #
    # The exact match is the whole fix. nginx checks `location = /uri` before any
    # prefix location and terminates the search when it hits one, so this wins
    # over `location /assets/sprites/` below no matter which order the two are
    # written in. Without it that prefix catches the request first and its
    # `try_files $uri =404` resolves "composed" against the sprite alias, where no
    # such file exists — so the endpoint 404'd in production while working in
    # development and in tests, its ETag and CORP logic never running once.
    location = /assets/sprites/composed {
        proxy_pass http://127.0.0.1:3002;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve sprite PNGs directly from Nginx
    location /assets/sprites/ {
        alias /srv/Magic-Garden-API/sprites_dump/sprite/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # The API hands out absolute sprite URLs, so the browser fetching one is
        # usually on another origin and cannot read the bytes without this.
        # Express sets `access-control-allow-origin: *` on every response it
        # handles (`src/api/middleware/cors.js:10-16`), but these files never
        # reach Express: a `fetch()` of the sprite fails while the JSON that named
        # it succeeds. Same header on the animations location below, for the same
        # reason.
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
        # `$uri` is the normalized path with the query string removed, which is
        # what makes `?v=<version>` work as the invalidation lever: the browser
        # keys its cache on the full URL, so a version bump is a new cache entry
        # and a refetch, while the disk lookup stays `.../Cactus.png`. There is no
        # proxy_cache or fastcgi_cache in this file, so nothing else can key on
        # the query string and drop it by accident.
        try_files $uri =404;
    }

    # Animated pet loops (WebP/GIF rendered from Rive), served straight from disk
    location /assets/animations/ {
        alias /srv/Magic-Garden-API/sprites_dump/animation/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
        try_files $uri =404;
    }

    # SSE endpoints (long-lived connections)
    location /live/stream {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        access_log off;
    }

    location /live/weather/stream {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        access_log off;
    }

    location /live/shops/stream {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
